<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trismegistus — window layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

:root{
  --paper:#F2F2F2; --raised:#FFFFFF; --sunken:#E5E5E5; --rule:#D9D9D9; --ink:#191919;
  --dark-panel:#35373C; --secondary:#666666; --muted:#999999; --yellow:#FFFA00; --blue:#0040E8;
  --green:#00FFA2; --magenta:#FF1AAC; --red:#E5332A; --term-green:#00875A; --term-red:#C4271F;
  --contour:#C8C8C0; --on-steel:#E9E9E9;
  --s2:2px; --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s20:20px; --s24:24px; --s32:32px; --s40:40px;
  --ctl:30px; --row-panel:40px; --row-list:52px;
  --t-label:11px; --t-meta:12px; --t-small:13px; --t-row:14px; --t-body:15px;
  --dur:180ms; --dur-out:120ms;
  --focus:var(--blue);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);overflow:hidden}
body{font-family:"Inter",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:var(--t-body);line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#stage{display:flex;width:100%;height:100%}
.frame{width:780px;height:561px;overflow:hidden;flex:none}
.frame > .win{transform:scale(.5);transform-origin:0 0}

/* ---------- window ---------- */
.win{position:relative;width:var(--w,1560px);height:1122px;flex:none;background:var(--paper);overflow:hidden;
  display:grid;grid-template-columns:316px var(--lc,520px) minmax(0,1fr)}
.contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sp,.lc,.dt{position:relative;z-index:1;min-height:0}

/* ---------- section panel ---------- */
.sp{margin:8px 0 8px 8px;width:300px;display:flex;flex-direction:column;padding:8px}
.sp-top{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 12px;margin-bottom:8px}
.lights{display:flex;gap:8px}
.lights i{display:block;width:12px;height:12px;border-radius:50%}
.sp-nav,.sp-kinds{display:flex;flex-direction:column;gap:2px}
.srow{height:var(--row-panel);display:flex;align-items:center;gap:12px;padding:0 12px;border:0;background:none;width:100%;
  text-align:left;font-size:var(--t-row);font-weight:400;--od-icon-size:18px;transition:background-color var(--dur) ease-out}
.srow .lbl{flex:1;min-width:0}
.srow .cnt{flex:none;font-size:var(--t-small)}
.srow[aria-current="page"],.srow.is-kind{font-weight:700}
.kmark{display:block;width:8px;height:8px;background:var(--yellow);border:1px solid var(--ink);flex:none}
.grp-head{margin-top:16px;margin-bottom:4px;height:28px;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;width:100%;
  font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left;--od-icon-size:14px}
.grp-head .lbl{flex:1}
.grp-head .chev{transition:transform var(--dur) ease-out}
.grp-head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.sp-id{margin-top:auto;display:flex;align-items:center;gap:12px;padding:8px 4px 4px 8px;min-height:56px}
.sp-id .idw{flex:1;min-width:0;display:flex;flex-direction:column}
.sp-id .name{font-weight:700;font-size:var(--t-row);line-height:1.3}
.sp-id .link{display:flex;align-items:center;gap:6px;font-size:var(--t-meta);line-height:1.3;min-width:0}
.sp-id .link > span:last-child{min-width:0}
.dot{display:block;width:8px;height:8px;border-radius:50%;flex:none}
.dev-av{width:32px;height:32px;display:grid;place-items:center;flex:none;--od-icon-size:18px}

/* ---------- list column ---------- */
.lc{display:flex;flex-direction:column;border-right:1px solid var(--rule);min-width:0}
.lc-head{height:52px;display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center;gap:8px;padding:0 16px;flex:none}
.lc-title{text-align:center;font-weight:800;font-size:var(--t-body);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.lc-title .sl{color:var(--secondary);font-weight:600;margin:0 4px}
.lc-search{margin:0 16px 12px;height:var(--ctl);display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--sunken);flex:none;--od-icon-size:16px;color:var(--secondary)}
.lc-search:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.lc-search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--t-row);color:var(--ink);height:100%}
.lc-search input::placeholder{color:var(--secondary)}
kbd,.kbd{font-family:inherit;font-size:var(--t-label);font-weight:600;line-height:1;padding:3px 4px;background:var(--raised);color:var(--secondary);border:1px solid var(--rule);white-space:nowrap}
.lc-scroll{flex:1;overflow-y:auto;min-height:0;padding-bottom:16px;scrollbar-width:thin}
.lsh{display:flex;align-items:center;gap:8px;font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lsh .n{margin-left:auto}
.empty{padding:24px 16px;font-size:var(--t-small);color:var(--secondary);line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:var(--t-row);margin-bottom:4px}

.row{position:relative;display:flex;align-items:center;gap:12px;border:0;text-align:left;color:var(--ink);background:none;
  transition:background-color var(--dur) ease-out}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-l1{display:flex;align-items:center;gap:8px;height:20px}
.row-title{flex:1;min-width:0;font-size:var(--t-row);font-weight:400;line-height:20px}
.row.is-strong .row-title{font-weight:700}
.row-time{flex:none;font-size:var(--t-meta);color:var(--secondary)}
.row-l2{display:flex;align-items:center;gap:6px;height:24px;--od-icon-size:14px}
.row-prev{flex:1;min-width:0;font-size:var(--t-small);color:var(--secondary);line-height:24px}
.row .pin,.row .lock{color:var(--secondary);flex:none}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;font-size:var(--t-label);font-weight:500;background:var(--sunken);color:var(--secondary);flex:none;white-space:nowrap}
.tag-more{font-size:var(--t-label);font-weight:600;color:var(--secondary);flex:none}
.av{display:grid;place-items:center;flex:none;color:var(--raised);font-weight:800;--od-icon-size:20px}
.av-app{background:var(--ink)}
.av-telegram{background:var(--blue)}
.av-terminal{background:var(--dark-panel)}
.av-cron{background:var(--sunken);color:var(--ink);border:1px solid var(--rule)}
.nd{display:none}

/* ---------- stickers ---------- */
.stk{display:inline-flex;align-items:stretch;height:24px;border:1px solid var(--ink);flex:none;font-size:var(--t-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap}
.stk .g{width:20px;display:grid;place-items:center;border-right:1px solid var(--ink);--od-icon-size:12px}
.stk .w{display:flex;align-items:center;gap:6px;padding:0 6px}
.stk.go{height:20px}
.stk.go .g{width:18px;border-right:0}
.stk-approval .g,.stk-approval .w{background:var(--magenta);color:var(--ink)}
.stk-run .g{background:var(--yellow);color:var(--ink)}
.stk-run .w{background:var(--ink);color:var(--raised)}
.stk-run .t{color:var(--yellow)}
.stk-failed .g{background:var(--raised);color:var(--term-red)}
.stk-failed .w{background:var(--term-red);color:var(--raised)}
.stk-done .g,.stk-done .w{background:var(--green);color:var(--ink)}
.on-dark .stk,.on-dark .stk .g{border-color:var(--on-steel)}
.skin-a .srow[aria-current="page"] .stk,.skin-a .srow[aria-current="page"] .stk .g{border-color:var(--ink)}

/* ---------- buttons ---------- */
.ib{width:var(--ctl);height:var(--ctl);display:inline-grid;place-items:center;border:0;padding:0;background:var(--sunken);color:var(--ink);flex:none;--od-icon-size:18px;transition:background-color var(--dur) ease-out}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--raised)}
.ib-plus{background:var(--yellow);color:var(--ink);border:1px solid var(--ink);--od-icon-size:18px}
.ib-plus.demoted{background:var(--raised);color:var(--ink)}
.btn{height:var(--ctl);display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--ink);font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:none;--od-icon-size:14px;white-space:nowrap}
.btn-ink{background:var(--ink);color:var(--raised)}
.btn-mark{background:var(--yellow);color:var(--ink)}
.btn-line{background:var(--raised);color:var(--ink)}
.btn:disabled{background:var(--sunken);color:var(--secondary);border-color:var(--rule);cursor:not-allowed}

/* ---------- detail ---------- */
.dt{display:flex;flex-direction:column;min-width:0;container-type:inline-size}
.dt-head{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px 0 24px;background:var(--raised);flex:none}
.dt-head .av{width:32px;height:32px;font-size:var(--t-row);--od-icon-size:16px}
.dt-ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.dt-ttl .t1{display:flex;align-items:center;gap:6px;font-weight:700;font-size:var(--t-body);line-height:1.3;--od-icon-size:14px}
.dt-ttl .t1 > span{min-width:0}
.dt-ttl .t2{font-size:var(--t-meta);color:var(--secondary);line-height:1.3}
.meter{display:flex;align-items:center;gap:8px;font-size:var(--t-meta);color:var(--secondary);flex:none}
.bars{display:flex;gap:2px}
.bars i{display:block;width:3px;height:12px;background:var(--rule)}
.bars i.on{background:var(--ink)}
.model{height:var(--ctl);display:inline-flex;align-items:center;gap:8px;padding:0 8px 0 12px;border:1px solid var(--rule);background:var(--raised);font-size:var(--t-small);font-weight:500;--od-icon-size:14px;flex:none}
.dt-tools{display:flex;gap:8px;flex:none}
.dt-rule{display:flex;height:4px;flex:none}
.dt-rule i{display:block;height:4px}
.dt-rule .m{width:48px;background:var(--magenta)}
.dt-rule .y{width:120px;background:var(--yellow)}
.dt-rule .g{flex:1;background:var(--green)}
.dt-scroll{flex:1;overflow-y:auto;min-height:0;padding:24px 24px 16px;scrollbar-width:thin}
.col{max-width:700px;margin:0 auto}
.who{font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary);margin:16px 0 4px}
.who:first-child{margin-top:0}
.you{background:var(--raised);border:1px solid var(--rule);padding:12px 16px;font-size:var(--t-body)}
.hermes{padding:0 12px;font-size:var(--t-body);line-height:1.6}
.hermes p{margin:0 0 12px}
.hermes ul,.hermes ol{margin:0 0 12px;padding-left:20px}
.hermes ul{list-style:none;padding-left:16px}
.hermes ul li{position:relative}
.hermes ul li::before{content:"";position:absolute;left:-16px;top:.62em;width:6px;height:6px;background:var(--ink)}
.hermes ol li::marker{color:var(--secondary);font-variant-numeric:tabular-nums}
.hermes li{margin-bottom:2px}
.hermes code{font-family:inherit;font-size:.92em;background:var(--sunken);padding:1px 4px}
.hermes pre{margin:0 0 12px;background:var(--dark-panel);color:var(--on-steel);padding:12px 16px;overflow-x:auto}
.hermes pre code,.term pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.55;background:none;padding:0}
.hermes pre .p{color:var(--green)}
.hermes pre .c{color:var(--muted)}
.cmdchip{height:var(--ctl);display:inline-flex;align-items:center;gap:8px;padding:0 8px 0 10px;border:0;background:var(--sunken);font-size:var(--t-label);font-weight:700;letter-spacing:.08em;--od-icon-size:14px;margin-left:12px}
.cmdchip .chev{transition:transform var(--dur) ease-out}
.cmdchip[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cmdlist{margin:8px 0 0 12px}
.working{display:flex;align-items:center;gap:8px;margin:12px 0 0 12px;font-size:var(--t-meta);color:var(--secondary)}
.working b{font-size:var(--t-label);letter-spacing:.08em;color:var(--ink)}
.approve{margin:4px 12px 0;background:var(--raised);border:1px solid var(--ink);padding:12px 16px}
.approve .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.approve pre{margin:0 0 12px}
.approve .acts{display:flex;gap:8px}
.newchat{padding:80px 24px;text-align:center;color:var(--secondary);font-size:var(--t-row)}
.newchat b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

.term{background:var(--dark-panel);color:var(--on-steel);padding:8px 24px;flex:none}
.term pre{margin:0 auto;max-width:700px}

.composer{background:var(--raised);border-top:1px solid var(--rule);padding:12px 24px 16px;flex:none}
.runline{display:flex;align-items:center;gap:8px;height:24px;margin-bottom:8px;font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.runline .sq{display:block;width:8px;height:8px;background:var(--term-green);flex:none}
.runline .tm{font-size:var(--t-meta);font-weight:500;letter-spacing:0;color:var(--secondary)}
.hints{margin-left:auto;display:flex;gap:12px;font-size:var(--t-meta);font-weight:400;letter-spacing:0;text-transform:none;color:var(--secondary)}
.hints span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.inrow{display:flex;align-items:center;gap:8px}
.inrow input{flex:1;min-width:0;height:var(--ctl);border:1px solid var(--ink);background:var(--raised);padding:0 12px;font-size:var(--t-row)}
.inrow input::placeholder{color:var(--secondary)}
.inrow input:disabled{background:var(--sunken);border-color:var(--rule)}
.stopb{width:var(--ctl);height:var(--ctl);display:grid;place-items:center;border:1px solid var(--term-red);background:var(--raised);padding:0;flex:none}
.stopb i{display:block;width:10px;height:10px;background:var(--term-red)}
.ib-clip{background:none}
@container (max-width: 700px){ .meter{display:none} .hints .x{display:none} }
@container (max-width: 460px){ .hints{display:none} }

/* ---------- overlays ---------- */
.menu{position:absolute;z-index:20;min-width:184px;background:var(--raised);border:1px solid var(--ink);padding:4px;display:flex;flex-direction:column}
.menu button{height:var(--ctl);border:0;background:none;text-align:left;padding:0 12px;font-size:var(--t-small)}
.menu button.danger{color:var(--term-red)}
.tip{position:absolute;z-index:30;background:var(--ink);color:var(--raised);font-size:var(--t-meta);padding:4px 8px;pointer-events:none;white-space:nowrap}
.toast{position:absolute;z-index:30;left:50%;bottom:132px;transform:translateX(-50%);background:var(--ink);color:var(--raised);font-size:var(--t-small);padding:8px 12px;white-space:nowrap}
.toast.in,.menu.in{animation:pop var(--dur) ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.toast.in{animation-name:popc}
@keyframes popc{from{opacity:0;transform:translate(-50%,4px)}to{opacity:1;transform:translate(-50%,0)}}

@media (hover:hover){
  .menu button:hover{background:var(--sunken)}
  .ib:hover{background:var(--rule)}
  .ib-plus:hover{background:var(--yellow);box-shadow:inset 0 0 0 1px var(--ink)}
  .ib-plus.demoted:hover{background:var(--sunken)}
  .cmdchip:hover{background:var(--rule)}
  .btn-ink:hover{background:var(--dark-panel)}
  .btn-line:hover{background:var(--sunken)}
}

/* =================== SKIN A — B2, neo-brutalist Endfield =================== */
.skin-a .sp{background:var(--ink);color:var(--raised);border:1px solid var(--ink);box-shadow:4px 4px 8px rgba(25,25,25,.4);--focus:var(--yellow)}
.skin-a .lights i{background:var(--secondary)}
.skin-a .sp .ib{background:none;color:var(--raised)}
.skin-a .srow{color:var(--raised)}
.skin-a .srow .cnt{color:var(--muted)}
.skin-a .srow[aria-current="page"]{background:var(--yellow);color:var(--ink)}
.skin-a .srow[aria-current="page"] .cnt{color:var(--ink)}
.skin-a .srow.is-kind{background:var(--dark-panel)}
.skin-a .srow.is-kind .cnt{color:var(--on-steel)}
.skin-a .grp-head{background:var(--dark-panel);color:var(--raised)}
.skin-a .grp-head::before{content:"";display:block;width:8px;height:8px;background:var(--yellow);flex:none}
.skin-a .sp-id{border-top:1px solid var(--dark-panel)}
.skin-a .sp-id .link{color:var(--on-steel)}
.skin-a .sp-id .dot{background:var(--green)}
.skin-a .dev-av{background:var(--dark-panel);color:var(--raised)}

.skin-a .lc-search input{border-radius:0}
.skin-a .lsh{height:28px;padding:0 16px;background:var(--ink);color:var(--yellow);margin:8px 0}
.skin-a .lsh::before{content:"";display:block;width:8px;height:8px;background:var(--yellow);flex:none}
.skin-a .lsh .n{color:var(--muted)}
.skin-a .row{width:calc(100% - 16px);margin:0 8px 4px;height:56px;padding:0 12px;background:var(--raised);border-top:4px solid var(--muted);border-bottom:4px solid var(--dark-panel)}
.skin-a .row .av{width:36px;height:36px;font-size:18px}
.skin-a .row-title{text-transform:uppercase;letter-spacing:.02em}
.skin-a .row.is-sel{background:var(--ink);border-top-color:var(--ink);border-bottom-color:var(--ink);margin-top:8px;margin-bottom:12px}
.skin-a .row.is-sel .row-title{color:var(--yellow)}

/* ---------- contour lines ---------- */
function contours(w, h) {
  const cx = w * .78, cy = h * .72, m = Math.min(w, h);
  let out = '';
  for (let k = 1; k <= 18; k++) {
    const r0 = k * m * .045;
    let d = '';
    for (let i = 0; i <= 180; i++) {
      const t = i / 180 * Math.PI * 2;
      const r = r0 * (1 + .045 * Math.sin(3 * t + k * .7) + .03 * Math.sin(5 * t + k * 1.3) + .02 * Math.sin(7 * t + k * .4));
      d += `${i ? 'L' : 'M'}${(cx + r * Math.cos(t) * 1.35).toFixed(1)} ${(cy + r * Math.sin(t)).toFixed(1)}`;
    }
    out += `<path d="${d}Z" stroke="#C8C8C0" stroke-width="1" fill="none" opacity="${k % 5 === 0 ? .9 : .55}"/>`;
  }
  return `<svg class="contours" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${out}</svg>`;
}

/* ---------- pieces ---------- */
function sticker(state, conv, glyphOnly) {
  if (!state) return '';
  const g = `<span class="g">${ic(STATE_GLYPH[state])}</span>`;
  if (glyphOnly) return `<span class="stk go stk-${state}" role="img" aria-label="${STATE_LONG[state]}" data-tip="${STATE_LONG[state]}">${g}</span>`;
  const t = state === 'run' ? `<span class="t num" data-run="${conv.id}">${mmss(conv.run)}</span>` : '';
  return `<span class="stk stk-${state}">${g}<span class="w">${STATE_WORD[state]}${t}</span></span>`;
}
function avatar(src) {
  if (src === 'cron') return `<span class="av av-cron" aria-hidden="true">${ic('cron')}</span>`;
  if (src === 'telegram') return `<span class="av av-telegram" aria-hidden="true">${ic('telegram')}</span>`;
  if (src === 'terminal') return `<span class="av av-terminal" aria-hidden="true">${ic('terminal')}</span>`;
  return `<span class="av av-app" aria-hidden="true">T</span>`;
}

function rowMarkup(c, selId, extra = '', idx = null) {
  const sel = selId === c.id;
  const tags = c.tags.slice(0, 2).map(t => `<span class="tag">${esc(t)}</span>`).join('') + (c.tags.length > 2 ? `<span class="tag-more num">+${c.tags.length - 2}</span>` : '');
  return `<button class="row ${sel ? 'is-sel on-dark' : ''} ${c.state || sel ? 'is-strong' : ''} ${extra}" type="button" data-act="row" data-id="${c.id}" data-key="row-${c.id}" ${sel ? 'aria-current="true"' : ''}
      aria-label="${esc(c.title)}, ${c.state ? STATE_LONG[c.state] + ', ' : ''}${esc(c.time)}${c.pinned ? ', pinned' : ''}">
    ${idx != null ? `<span class="idx num" aria-hidden="true">${String(idx).padStart(2, '0')}</span>` : ''}${avatar(c.src)}
    <span class="row-body">

      <nav class="sp-nav">${SECTIONS.map(srow).join('')}</nav>
      <button class="grp-head" type="button" data-act="group" data-key="grp" aria-expanded="${st.groupOpen}" aria-controls="kinds-${skin}${narrow ? 'n' : ''}"><span class="lbl">Chats</span>${ic('chev','chev')}</button>
      <div class="sp-kinds" id="kinds-${skin}${narrow ? 'n' : ''}" ${st.groupOpen ? '' : 'hidden'}>${KINDS.map(krow).join('')}</div>
      <div class="sp-id">
        <span class="dev-av" aria-hidden="true">${ic('laptop')}</span>
        <div class="idw"><span class="name">macbook</span><span class="link"><span class="dot" aria-hidden="true"></span><span class="od-truncate">linked · hermes.lab.x-muramasa.dev</span></span></div>
        <button class="ib" type="button" data-act="menu" data-menu="id" data-key="id-more" aria-label="Device menu" aria-haspopup="menu" data-tip="Settings, unpair">${ic('more')}</button>
      </div>`;
    if (skin !== 'b') sp.classList.add('on-dark');
  }

  /* list column */
  const rowHTML = (c, i) => rowMarkup(c, st.sel, '', A3 ? st.convs.indexOf(c) + 1 : null);
  const head = (label, n) => A3 ? `<div class="lsh" role="presentation"><span>// ${label}</span><i class="ln"></i><span class="n num">${String(n).padStart(2, '0')}</span></div>` : `<div class="lsh" role="presentation">${label}<span class="n num">${n}</span></div>`;
  const title = (label, n) => A3 ? `<span class="lbl3">// ${esc(label)}</span>${n != null ? `<span class="big">${n}</span>` : ''}` : `${esc(label)}${n != null ? `<span class="sl">//</span>${n}` : ''}`;
  function renderList() {
    const sec = SECTIONS.find(s => s.id === st.section);
    const kind = KINDS.find(k => k.id === st.kind);
    if (st.section !== 'chat') {
      lcTitle.innerHTML = title(sec.label, sec.count);
      lcScroll.innerHTML = `<div class="empty"><b>${esc(sec.label)}</b>${sec.count != null ? `${sec.count} ${sec.hint}. ` : sec.hint ? `${sec.hint[0].toUpperCase() + sec.hint.slice(1)}. ` : ''}This prototype draws the Chat section only; pick Chat to see the list.</div>`;
      return;
    }
    lcTitle.innerHTML = title(kind.label, kind.count);
    if (!['app', 'all'].includes(st.kind)) {
      lcScroll.innerHTML = `<div class="empty"><b>${kind.count} ${esc(kind.label)} conversations</b>The sample data in this prototype holds App conversations only. Pick App or All.</div>`;
      return;
    }
    const q = st.filter.trim().toLowerCase();
    const match = c => !q || c.title.toLowerCase().includes(q) || c.preview.toLowerCase().includes(q) || c.tags.some(t => t.includes(q));
    const pinned = st.convs.filter(c => c.pinned && match(c)), rest = st.convs.filter(c => !c.pinned && match(c));
    if (!pinned.length && !rest.length) {
      lcScroll.innerHTML = `<div class="empty"><b>No conversation matches “${esc(st.filter)}”</b>Clear the filter to see all ${kind.count}.</div>`;
      return;
    }
    lcScroll.innerHTML =
      (pinned.length ? `${head('Pinned', pinned.length)}${pinned.map(rowHTML).join('')}` : '') +
      (rest.length ? `${head('Conversations', rest.length)}${rest.map(rowHTML).join('')}` : '');
    const plus = $('.ib-plus');
    const running = conv(st.sel) && conv(st.sel).state === 'run';
    plus.classList.toggle('demoted', !!running);
  }

  /* detail */
  function renderDetail() {
    const c = conv(st.sel);
    if (!c) { dt.innerHTML = ''; return; }
    const running = c.state === 'run';
    let body;
    if (c.id === 'swift') body = SWIFT_HTML;
    else if (c.isNew) body = c.extra.length ? '' : `<div class="newchat"><b>New conversation</b>Ask Hermes anything; it runs on hermes.lab.</div>`;
    else body = (c.ask ? `<div class="who num">You // 12:10</div><div class="you">${esc(c.ask)}</div>` : '') +
      `<div class="who num">Hermes // 12:14</div><div class="hermes">${c.reply}</div>` +
      (c.approve && c.state === 'approval' ? `<div class="approve"><div class="hd">${sticker('approval', c)}<span>Hermes wants to run</span></div>
        <div class="hermes" style="padding:0"><pre><code><span class="p">$</span> ${esc(c.approve)}</code></pre></div>
        <div class="acts"><button class="btn btn-ink" type="button" data-act="approve" data-key="approve">Approve ${ic('arrow')}</button><button class="btn btn-line" type="button" data-act="deny" data-key="deny">Deny</button></div></div>` : '');
    body += c.extra.map(m => `<div class="who num">${m.who} // ${m.time}</div>${m.who === 'You' ? `<div class="you">${esc(m.text)}</div>` : `<div class="hermes"><p>${esc(m.text)}</p></div>`}`).join('');
    if (running) body += `<div class="working num"><b>WORKING</b><span data-run="${c.id}">${mmss(c.run)}</span><span>· 2 tools</span></div>`;

    const sub = (A3 && c.id === 'swift') ? 'Trismegistus · run_7f3a2c · seq 214 · 38 ms · started 13:52' : c.sub || (c.readOnly ? 'Cron · read-only' : c.isNew ? 'Trismegistus · not started' : `Trismegistus · last activity ${c.time}`);
    const composer = c.readOnly
      ? `<div class="runline"><span>Read-only</span><span class="tm">written by cron · 07:00 daily</span></div>
         <div class="inrow"><input type="text" disabled placeholder="Cron conversations can’t be answered" aria-label="Message (disabled)"></div>`
      : running
      ? `<div class="runline num"><span class="sq" aria-hidden="true"></span><span>Run active</span><span class="tm" data-run="${c.id}">${mmss(c.run)}</span>
           <span class="hints"><span><kbd>⌘↩</kbd>steer</span><span><kbd>⌘.</kbd>stop</span><span class="x"><kbd>⌘⌥T</kbd>terminal</span><span class="x"><kbd>⌘K</kbd>conversations</span></span></div>
         <div class="inrow"><button class="ib ib-clip" type="button" data-act="toast" data-msg="Attach a file" data-key="clip" aria-label="Attach" data-tip="Attach">${ic('clip')}</button>
           <input type="text" placeholder="Steer this run" aria-label="Steer this run" data-key="msg">
           <button class="stopb" type="button" data-act="stop" data-key="stop" aria-label="Stop run" data-tip="Stop run  ⌘."><i></i></button>
           <button class="btn btn-mark" type="button" data-act="send" data-key="send">Steer ${ic('arrow')}</button></div>`
      : `<div class="runline"><span>Idle</span><span class="tm">${c.isNew ? 'no runs yet' : 'last run ' + esc(c.time)}</span>
           <span class="hints"><span><kbd>↩</kbd>send</span><span class="x"><kbd>⌘K</kbd>conversations</span></span></div>
         <div class="inrow"><button class="ib ib-clip" type="button" data-act="toast" data-msg="Attach a file" data-key="clip" aria-label="Attach" data-tip="Attach">${ic('clip')}</button>
           <input type="text" placeholder="Message Hermes" aria-label="Message Hermes" data-key="msg">
           <button class="btn btn-ink" type="button" data-act="send" data-key="send">Send ${ic('arrow')}</button></div>`;

    dt.innerHTML = `
      <header class="dt-head">
        ${avatar(c.src)}
        <div class="dt-ttl"><span class="t1"><span class="od-truncate">${esc(c.title)}</span>${c.pinned ? ic('pin') : ''}</span><span class="t2 od-truncate num">${esc(sub)}</span></div>
        <div class="meter num"><span>350K / 1M · 35%</span><span class="bars" aria-hidden="true">${Array.from({length:12}, (_, i) => `<i class="${i < 4 ? 'on' : ''}"></i>`).join('')}</span></div>
        <button class="model" type="button" data-act="toast" data-msg="Model: Opus 5.5 (claude-opus-5-5)" data-key="model" aria-label="Model, Opus 5.5">Opus 5.5 ${ic('chev')}</button>
        <div class="dt-tools">
          <button class="ib" type="button" data-act="term" data-key="term" aria-pressed="${st.term}" aria-label="Terminal" data-tip="Terminal  ⌘⌥T">${ic('terminal')}</button>
          <button class="ib" type="button" data-act="toast" data-msg="Settings open in their own window  ⌘," data-key="settings" aria-label="Settings" data-tip="Settings  ⌘,">${ic('sliders')}</button>
          <button class="ib" type="button" data-act="menu" data-menu="detail" data-key="dt-more" aria-label="Conversation actions" aria-haspopup="menu" data-tip="More">${ic('more')}</button>
        </div>
      </header>
      <div class="dt-rule" aria-hidden="true"><i class="m"></i><i class="y"></i><i class="g"></i><i class="hz"></i></div>
      <div class="dt-scroll"><div class="col">${body}</div></div>
      <div class="term" ${st.term ? '' : 'hidden'}><pre>hermes@lab ~/trismegistus-mac $ swift build
Building for debugging...
[214/214] Compiling Trismegistus SidebarView.swift
Build complete! (6.12s)</pre></div>
      <div class="composer"><div class="col">${composer}</div></div>`;
    if (st.cmdOpen) { const ch = dt.querySelector('.cmdchip'); if (ch) { ch.setAttribute('aria-expanded', 'true'); dt.querySelector('.cmdlist').hidden = false; } }
    const sc = dt.querySelector('.dt-scroll');
    sc.scrollTop = sc.scrollHeight;
  }

  function renderAll() { keepFocus(() => { renderPanel(); renderList(); renderDetail(); }); }

  /* overlays */
  function rel(el) {
    const wr = win.getBoundingClientRect(), r = el.getBoundingClientRect(), s = wr.width / win.offsetWidth || 1;
    return {x:(r.left - wr.left) / s, y:(r.top - wr.top) / s, w:r.width / s, h:r.height / s};
  }
  let toastT;
  function say(msg) {
    toast.textContent = msg; toast.hidden = false;
    toast.classList.remove('in'); void toast.offsetWidth; toast.classList.add('in');
    clearTimeout(toastT); toastT = setTimeout(() => { toast.hidden = true; }, 2400);
  }
  let menuFor = null;
  const MENUS = {
    list:[['Rename', 'Rename the conversation'], ['Tags', 'Edit tags'], ['Hand off', 'Hand off to another device']],
    id:[['Settings', 'Settings open in their own window'], ['Unpair', 'Unpair asks for confirmation first', 'danger']],
    detail:[['Copy run id', 'Copied run_7f3a2c'], ['Open transcript', 'Transcript opens in Agents'], ['Pin', 'Pinned state toggles here']],
  };
  function openMenu(btn) {
    closeMenu();
    menuFor = btn;
    menu.innerHTML = MENUS[btn.dataset.menu].map(([l, m, cls]) => `<button type="button" role="menuitem" class="${cls || ''}" data-act="menuitem" data-msg="${esc(m)}">${l}</button>`).join('');
    menu.hidden = false;
    const r = rel(btn), mw = 184;
    let x = btn.dataset.menu === 'detail' ? r.x + r.w - mw : r.x;
    let y = r.y + r.h + 4;
    if (btn.dataset.menu === 'id') y = r.y - 4 - (MENUS.id.length * 30 + 10);
    menu.style.left = Math.max(8, x) + 'px'; menu.style.top = y + 'px';
    menu.classList.remove('in'); void menu.offsetWidth; menu.classList.add('in');
    btn.setAttribute('aria-expanded', 'true');
    menu.querySelector('button').focus();
  }
  function closeMenu(restore) {
    if (menu.hidden) return;
    menu.hidden = true;
    if (menuFor) { menuFor.setAttribute('aria-expanded', 'false'); if (restore && menuFor.isConnected) menuFor.focus(); }
    menuFor = null;
  }
  function showTip(el) {
    const t = el.dataset.tip; if (!t) return;
    tip.textContent = t; tip.hidden = false;
    const r = rel(el), tw = tip.offsetWidth;
    let x = r.x + r.w / 2 - tw / 2;
    x = Math.min(Math.max(8, x), win.offsetWidth - tw - 8);
    tip.style.left = x + 'px'; tip.style.top = (r.y + r.h + 6) + 'px';
  }
  const hideTip = () => { tip.hidden = true; };
  win.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
  win.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
  win.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el && el.matches(':focus-visible')) showTip(el); else hideTip(); });
  win.addEventListener('focusout', hideTip);

  /* actions */
  function send() {
    const c = conv(st.sel), input = dt.querySelector('.inrow input');
    if (!c || !input || input.disabled) return;
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    const now = new Date(), tm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    c.extra.push({who:'You', time:tm, text});
    c.preview = text; c.time = 'now';
    if (c.state !== 'run') { c.state = 'run'; c.run = 0; }
    keepFocus(() => { renderPanel(); renderList(); renderDetail(); });
    const ni = dt.querySelector('.inrow input'); if (ni) ni.focus();
  }

  win.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!menu.hidden && !e.target.closest('.menu') && !(el && el === menuFor)) closeMenu();
    if (!el) return;
    const a = el.dataset.act;
    if (a === 'section') { st.section = el.dataset.id; renderAll(); }
    else if (a === 'kind') { st.section = 'chat'; st.kind = el.dataset.id; st.filter = ''; filterInput.value = ''; renderAll(); }
    else if (a === 'group') { st.groupOpen = !st.groupOpen; keepFocus(renderPanel); }
    else if (a === 'row') {
      const c = conv(el.dataset.id);
      if (c.state === 'done' || c.state === 'failed') c.state = null; // opening marks it seen
      st.sel = c.id; st.cmdOpen = false; renderAll();
    }
    else if (a === 'new') {
      st.newN++;
      const id = 'new' + st.newN;
      st.convs.splice(BASE.filter(c => c.pinned).length, 0, {id, title:'New conversation', time:'now', src:'app', tags:[], extra:[], preview:'No messages yet', isNew:true});
      st.section = 'chat'; st.kind = st.kind === 'all' ? 'all' : 'app'; st.sel = id; st.filter = ''; filterInput.value = '';
      renderAll();
      const ni = dt.querySelector('.inrow input'); if (ni) ni.focus();
    }
    else if (a === 'cmds') { st.cmdOpen = !st.cmdOpen; el.setAttribute('aria-expanded', st.cmdOpen); dt.querySelector('.cmdlist').hidden = !st.cmdOpen; }
    else if (a === 'term') { st.term = !st.term; el.setAttribute('aria-pressed', st.term); dt.querySelector('.term').hidden = !st.term; }
    else if (a === 'stop') { const c = conv(st.sel); c.state = null; c.extra.push({who:'Hermes', time:'now', text:'Stopped. Nothing after the last finished step was written.'}); renderAll(); say('Run stopped'); }
    else if (a === 'send') send();
    else if (a === 'approve') { const c = conv(st.sel); c.state = 'run'; c.run = 0; c.preview = 'Running ' + c.approve; renderAll(); say('Approved — run started'); }
    else if (a === 'deny') { const c = conv(st.sel); c.state = null; c.extra.push({who:'Hermes', time:'now', text:'Skipped the release build. Say when you want it.'}); c.preview = 'Skipped the release build'; renderAll(); }
    else if (a === 'menu') { if (menuFor === el) closeMenu(true); else openMenu(el); }
    else if (a === 'menuitem') { const m = el.dataset.msg; closeMenu(true); say(m); }
    else if (a === 'toast') say(el.dataset.msg);
  });
  win.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !menu.hidden) { e.preventDefault(); closeMenu(true); }
    else if (e.key === 'Enter' && e.target.matches('.inrow input')) { e.preventDefault(); send(); }
    else if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      const items = [...menu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
      items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
    }
  });
  filterInput.addEventListener('input', () => { st.filter = filterInput.value; if (st.section !== 'chat') st.section = 'chat'; renderPanel(); renderList(); });

  renderAll();
  const api = {win, st, tick() {
    st.convs.forEach(c => { if (c.state === 'run') { c.run++; win.querySelectorAll(`[data-run="${c.id}"]`).forEach(n => { n.textContent = mmss(c.run); }); } });
  }, focusFilter() { filterInput.focus(); }};
  WINS.push(api);
  return win;
}

/* ---------- routing ---------- */
const stage = document.getElementById('stage');
function route() {
  const h = location.hash.slice(1);
  const v = ['a', 'b', 'a2', 'a3', 'all', 'compare', 'a-narrow', 'b-narrow', 'a2-narrow', 'a3-narrow', 'a2-states', 'a3-states'].includes(h) ? h : 'all';
  WINS.length = 0;
  stage.innerHTML = '';
  let w = 1560, hgt = 1122;
  if (v === 'all' || v === 'compare') {
    hgt = 561;
    (v === 'all' ? ['a', 'a2'] : ['a2', 'a3']).forEach(s => { const f = document.createElement('div'); f.className = 'frame'; f.appendChild(createWin(s, false)); stage.appendChild(f); });
  } else if (v.endsWith('-states')) {
    w = 520;
    stage.appendChild(createStates(v.split('-')[0]));
  } else {
    const [skin, mod] = v.split('-');
    const narrow = mod === 'narrow';
    w = narrow ? 1180 : 1560;
    stage.appendChild(createWin(skin, narrow));
  }
  document.documentElement.style.width = document.body.style.width = w + 'px';
  document.documentElement.style.height = document.body.style.height = hgt + 'px';
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (WINS[0]) WINS[0].focusFilter(); }
});
setInterval(() => WINS.forEach(w => w.tick()), 1000);
route();
})();
</script>
</body>
</html>
