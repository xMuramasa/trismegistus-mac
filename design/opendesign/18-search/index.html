<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trismegistus — window layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

:root{
  --paper:#F2F2F2; --raised:#FFFFFF; --sunken:#E5E5E5; --rule:#D9D9D9; --ink:#191919;
  --dark-panel:#35373C; --secondary:#666666; --muted:#999999; --yellow:#FFFA00; --blue:#0040E8;
  --green:#00FFA2; --magenta:#FF1AAC; --red:#E5332A; --term-green:#00875A; --term-red:#C4271F;
  --contour:#C8C8C0; --on-steel:#E9E9E9;
  --s2:2px; --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s20:20px; --s24:24px; --s32:32px; --s40:40px;
  --ctl:30px; --row-panel:40px; --row-list:52px;
  --t-label:11px; --t-meta:12px; --t-small:13px; --t-row:14px; --t-body:15px;
  --dur:180ms; --dur-out:120ms;
  --focus:var(--blue);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);overflow:hidden}
body{font-family:"Inter",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:var(--t-body);line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#stage{display:flex;width:100%;height:100%}
.frame{width:780px;height:561px;overflow:hidden;flex:none}
.frame > .win{transform:scale(.5);transform-origin:0 0}

/* ---------- window ---------- */
.win{position:relative;width:var(--w,1560px);height:1122px;flex:none;background:var(--paper);overflow:hidden;
  display:grid;grid-template-columns:316px var(--lc,520px) minmax(0,1fr)}
.contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sp,.lc,.dt{position:relative;z-index:1;min-height:0}

/* ---------- section panel ---------- */
.sp{margin:8px 0 8px 8px;width:300px;display:flex;flex-direction:column;padding:8px}
.sp-top{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 12px;margin-bottom:8px}
.lights{display:flex;gap:8px}
.lights i{display:block;width:12px;height:12px;border-radius:50%}
.sp-nav,.sp-kinds{display:flex;flex-direction:column;gap:2px}
.srow{height:var(--row-panel);display:flex;align-items:center;gap:12px;padding:0 12px;border:0;background:none;width:100%;
  text-align:left;font-size:var(--t-row);font-weight:400;--od-icon-size:18px;transition:background-color var(--dur) ease-out}
.srow .lbl{flex:1;min-width:0}
.srow .cnt{flex:none;font-size:var(--t-small)}
.srow[aria-current="page"],.srow.is-kind{font-weight:700}
.kmark{display:block;width:8px;height:8px;background:var(--yellow);border:1px solid var(--ink);flex:none}
.grp-head{margin-top:16px;margin-bottom:4px;height:28px;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;width:100%;
  font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left;--od-icon-size:14px}
.grp-head .lbl{flex:1}
.grp-head .chev{transition:transform var(--dur) ease-out}
.grp-head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.sp-id{margin-top:auto;display:flex;align-items:center;gap:12px;padding:8px 4px 4px 8px;min-height:56px}
.sp-id .idw{flex:1;min-width:0;display:flex;flex-direction:column}
.sp-id .name{font-weight:700;font-size:var(--t-row);line-height:1.3}
.sp-id .link{display:flex;align-items:center;gap:6px;font-size:var(--t-meta);line-height:1.3;min-width:0}
.sp-id .link > span:last-child{min-width:0}
.dot{display:block;width:8px;height:8px;border-radius:50%;flex:none}
.dev-av{width:32px;height:32px;display:grid;place-items:center;flex:none;--od-icon-size:18px}

/* ---------- list column ---------- */
.lc{display:flex;flex-direction:column;border-right:1px solid var(--rule);min-width:0}
.lc-head{height:52px;display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center;gap:8px;padding:0 16px;flex:none}
.lc-title{text-align:center;font-weight:800;font-size:var(--t-body);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.lc-title .sl{color:var(--secondary);font-weight:600;margin:0 4px}
.lc-search{margin:0 16px 12px;height:var(--ctl);display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--sunken);flex:none;--od-icon-size:16px;color:var(--secondary)}
.lc-search:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.lc-search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--t-row);color:var(--ink);height:100%}
.lc-search input::placeholder{color:var(--secondary)}
kbd,.kbd{font-family:inherit;font-size:var(--t-label);font-weight:600;line-height:1;padding:3px 4px;background:var(--raised);color:var(--secondary);border:1px solid var(--rule);white-space:nowrap}
.lc-scroll{flex:1;overflow-y:auto;min-height:0;padding-bottom:16px;scrollbar-width:thin}
.lsh{display:flex;align-items:center;gap:8px;font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lsh .n{margin-left:auto}
.empty{padding:24px 16px;font-size:var(--t-small);color:var(--secondary);line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:var(--t-row);margin-bottom:4px}

.row{position:relative;display:flex;align-items:center;gap:12px;border:0;text-align:left;color:var(--ink);background:none;
  transition:background-color var(--dur) ease-out}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-l1{display:flex;align-items:center;gap:8px;height:20px}
.row-title{flex:1;min-width:0;font-size:var(--t-row);font-weight:400;line-height:20px}
.row.is-strong .row-title{font-weight:700}
.row-time{flex:none;font-size:var(--t-meta);color:var(--secondary)}
.row-l2{display:flex;align-items:center;gap:6px;height:24px;--od-icon-size:14px}
.row-prev{flex:1;min-width:0;font-size:var(--t-small);color:var(--secondary);line-height:24px}
.row .pin,.row .lock{color:var(--secondary);flex:none}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;font-size:var(--t-label);font-weight:500;background:var(--sunken);color:var(--secondary);flex:none;white-space:nowrap}
.tag-more{font-size:var(--t-label);font-weight:600;color:var(--secondary);flex:none}
.av{display:grid;place-items:center;flex:none;color:var(--raised);font-weight:800;--od-icon-size:20px}
.av-app{background:var(--ink)}
.av-telegram{background:var(--blue)}
.av-terminal{background:var(--dark-panel)}
.av-cron{background:var(--sunken);color:var(--ink);border:1px solid var(--rule)}
.nd{display:none}

/* ---------- stickers ---------- */
.stk{display:inline-flex;align-items:stretch;height:24px;border:1px solid var(--ink);flex:none;font-size:var(--t-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap}
.stk .g{width:20px;display:grid;place-items:center;border-right:1px solid var(--ink);--od-icon-size:12px}
.stk .w{display:flex;align-items:center;gap:6px;padding:0 6px}
.stk.go{height:20px}
.stk.go .g{width:18px;border-right:0}
.stk-approval .g,.stk-approval .w{background:var(--magenta);color:var(--ink)}
.stk-run .g{background:var(--yellow);color:var(--ink)}
.stk-run .w{background:var(--ink);color:var(--raised)}
.stk-run .t{color:var(--yellow)}
.stk-failed .g{background:var(--raised);color:var(--term-red)}
.stk-failed .w{background:var(--term-red);color:var(--raised)}
.stk-done .g,.stk-done .w{background:var(--green);color:var(--ink)}
.on-dark .stk,.on-dark .stk .g{border-color:var(--on-steel)}
.skin-a .srow[aria-current="page"] .stk,.skin-a .srow[aria-current="page"] .stk .g{border-color:var(--ink)}

/* ---------- buttons ---------- */
.ib{width:var(--ctl);height:var(--ctl);display:inline-grid;place-items:center;border:0;padding:0;background:var(--sunken);color:var(--ink);flex:none;--od-icon-size:18px;transition:background-color var(--dur) ease-out}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--raised)}
.ib-plus{background:var(--yellow);color:var(--ink);border:1px solid var(--ink);--od-icon-size:18px}
.ib-plus.demoted{background:var(--raised);color:var(--ink)}
.btn{height:var(--ctl);display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--ink);font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:none;--od-icon-size:14px;white-space:nowrap}
.btn-ink{background:var(--ink);color:var(--raised)}
.btn-mark{background:var(--yellow);color:var(--ink)}
.btn-line{background:var(--raised);color:var(--ink)}
.btn:disabled{background:var(--sunken);color:var(--secondary);border-color:var(--rule);cursor:not-allowed}

/* ---------- detail ---------- */
.dt{display:flex;flex-direction:column;min-width:0;container-type:inline-size}
.dt-head{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px 0 24px;background:var(--raised);flex:none}
.dt-head .av{width:32px;height:32px;font-size:var(--t-row);--od-icon-size:16px}
.dt-ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.dt-ttl .t1{display:flex;align-items:center;gap:6px;font-weight:700;font-size:var(--t-body);line-height:1.3;--od-icon-size:14px}
.dt-ttl .t1 > span{min-width:0}
.dt-ttl .t2{font-size:var(--t-meta);color:var(--secondary);line-height:1.3}
.meter{display:flex;align-items:center;gap:8px;font-size:var(--t-meta);color:var(--secondary);flex:none}
.bars{display:flex;gap:2px}
.bars i{display:block;width:3px;height:12px;background:var(--rule)}
.bars i.on{background:var(--ink)}
.model{height:var(--ctl);display:inline-flex;align-items:center;gap:8px;padding:0 8px 0 12px;border:1px solid var(--rule);background:var(--raised);font-size:var(--t-small);font-weight:500;--od-icon-size:14px;flex:none}
.dt-tools{display:flex;gap:8px;flex:none}
.dt-rule{display:flex;height:4px;flex:none}
.dt-rule i{display:block;height:4px}
.dt-rule .m{width:48px;background:var(--magenta)}
.dt-rule .y{width:120px;background:var(--yellow)}
.dt-rule .g{flex:1;background:var(--green)}
.dt-scroll{flex:1;overflow-y:auto;min-height:0;padding:24px 24px 16px;scrollbar-width:thin}
.col{max-width:700px;margin:0 auto}
.who{font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary);margin:16px 0 4px}
.who:first-child{margin-top:0}
.you{background:var(--raised);border:1px solid var(--rule);padding:12px 16px;font-size:var(--t-body)}
.hermes{padding:0 12px;font-size:var(--t-body);line-height:1.6}
.hermes p{margin:0 0 12px}
.hermes ul,.hermes ol{margin:0 0 12px;padding-left:20px}
.hermes ul{list-style:none;padding-left:16px}
.hermes ul li{position:relative}
.hermes ul li::before{content:"";position:absolute;left:-16px;top:.62em;width:6px;height:6px;background:var(--ink)}
.hermes ol li::marker{color:var(--secondary);font-variant-numeric:tabular-nums}
.hermes li{margin-bottom:2px}
.hermes code{font-family:inherit;font-size:.92em;background:var(--sunken);padding:1px 4px}
.hermes pre{margin:0 0 12px;background:var(--dark-panel);color:var(--on-steel);padding:12px 16px;overflow-x:auto}
.hermes pre code,.term pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.55;background:none;padding:0}
.hermes pre .p{color:var(--green)}
.hermes pre .c{color:var(--muted)}
.cmdchip{height:var(--ctl);display:inline-flex;align-items:center;gap:8px;padding:0 8px 0 10px;border:0;background:var(--sunken);font-size:var(--t-label);font-weight:700;letter-spacing:.08em;--od-icon-size:14px;margin-left:12px}
.cmdchip .chev{transition:transform var(--dur) ease-out}
.cmdchip[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cmdlist{margin:8px 0 0 12px}
.working{display:flex;align-items:center;gap:8px;margin:12px 0 0 12px;font-size:var(--t-meta);color:var(--secondary)}
.working b{font-size:var(--t-label);letter-spacing:.08em;color:var(--ink)}
.approve{margin:4px 12px 0;background:var(--raised);border:1px solid var(--ink);padding:12px 16px}
.approve .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.approve pre{margin:0 0 12px}
.approve .acts{display:flex;gap:8px}
.newchat{padding:80px 24px;text-align:center;color:var(--secondary);font-size:var(--t-row)}
.newchat b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

.term{background:var(--dark-panel);color:var(--on-steel);padding:8px 24px;flex:none}
.term pre{margin:0 auto;max-width:700px}

.composer{background:var(--raised);border-top:1px solid var(--rule);padding:12px 24px 16px;flex:none}
.runline{display:flex;align-items:center;gap:8px;height:24px;margin-bottom:8px;font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.runline .sq{display:block;width:8px;height:8px;background:var(--term-green);flex:none}
.runline .tm{font-size:var(--t-meta);font-weight:500;letter-spacing:0;color:var(--secondary)}
.hints{margin-left:auto;display:flex;gap:12px;font-size:var(--t-meta);font-weight:400;letter-spacing:0;text-transform:none;color:var(--secondary)}
.hints span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.inrow{display:flex;align-items:center;gap:8px}
.inrow input{flex:1;min-width:0;height:var(--ctl);border:1px solid var(--ink);background:var(--raised);padding:0 12px;font-size:var(--t-row)}
.inrow input::placeholder{color:var(--secondary)}
.inrow input:disabled{background:var(--sunken);border-color:var(--rule)}
.stopb{width:var(--ctl);height:var(--ctl);display:grid;place-items:center;border:1px solid var(--term-red);background:var(--raised);padding:0;flex:none}
.stopb i{display:block;width:10px;height:10px;background:var(--term-red)}
.ib-clip{background:none}
@container (max-width: 700px){ .meter{display:none} .hints .x{display:none} }
@container (max-width: 460px){ .hints{display:none} }

/* ---------- overlays ---------- */
.menu{position:absolute;z-index:20;min-width:184px;background:var(--raised);border:1px solid var(--ink);padding:4px;display:flex;flex-direction:column}
.menu button{height:var(--ctl);border:0;background:none;text-align:left;padding:0 12px;font-size:var(--t-small)}
.menu button.danger{color:var(--term-red)}
.tip{position:absolute;z-index:30;background:var(--ink);color:var(--raised);font-size:var(--t-meta);padding:4px 8px;pointer-events:none;white-space:nowrap}
.toast{position:absolute;z-index:30;left:50%;bottom:132px;transform:translateX(-50%);background:var(--ink);color:var(--raised);font-size:var(--t-small);padding:8px 12px;white-space:nowrap}
.toast.in,.menu.in{animation:pop var(--dur) ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.toast.in{animation-name:popc}
@keyframes popc{from{opacity:0;transform:translate(-50%,4px)}to{opacity:1;transform:translate(-50%,0)}}

@media (hover:hover){
  .menu button:hover{background:var(--sunken)}
  .ib:hover{background:var(--rule)}
  .ib-plus:hover{background:var(--yellow);box-shadow:inset 0 0 0 1px var(--ink)}
  .ib-plus.demoted:hover{background:var(--sunken)}
  .cmdchip:hover{background:var(--rule)}
  .btn-ink:hover{background:var(--dark-panel)}
  .btn-line:hover{background:var(--sunken)}
}

/* =================== SKIN A — B2, neo-brutalist Endfield =================== */
.skin-a .sp{background:var(--ink);color:var(--raised);border:1px solid var(--ink);box-shadow:4px 4px 8px rgba(25,25,25,.4);--focus:var(--yellow)}
.skin-a .lights i{background:var(--secondary)}
.skin-a .sp .ib{background:none;color:var(--raised)}
.skin-a .srow{color:var(--raised)}
.skin-a .srow .cnt{color:var(--muted)}
.skin-a .srow[aria-current="page"]{background:var(--yellow);color:var(--ink)}
.skin-a .srow[aria-current="page"] .cnt{color:var(--ink)}
.skin-a .srow.is-kind{background:var(--dark-panel)}
.skin-a .srow.is-kind .cnt{color:var(--on-steel)}
.skin-a .grp-head{background:var(--dark-panel);color:var(--raised)}
.skin-a .grp-head::before{content:"";display:block;width:8px;height:8px;background:var(--yellow);flex:none}
.skin-a .sp-id{border-top:1px solid var(--dark-panel)}
.skin-a .sp-id .link{color:var(--on-steel)}
.skin-a .sp-id .dot{background:var(--green)}
.skin-a .dev-av{background:var(--dark-panel);color:var(--raised)}

.skin-a .lc-search input{border-radius:0}
.skin-a .lsh{height:28px;padding:0 16px;background:var(--ink);color:var(--yellow);margin:8px 0}
.skin-a .lsh::before{content:"";display:block;width:8px;height:8px;background:var(--yellow);flex:none}
.skin-a .lsh .n{color:var(--muted)}
.skin-a .row{width:calc(100% - 16px);margin:0 8px 4px;height:56px;padding:0 12px;background:var(--raised);border-top:4px solid var(--muted);border-bottom:4px solid var(--dark-panel)}
.skin-a .row .av{width:36px;height:36px;font-size:18px}
.skin-a .row-title{text-transform:uppercase;letter-spacing:.02em}
.skin-a .row.is-sel{background:var(--ink);border-top-color:var(--ink);border-bottom-color:var(--ink);margin-top:8px;margin-bottom:12px}
.skin-a .row.is-sel .row-title{color:var(--yellow)}

.ck input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--ink);flex:none}
.ck .n{width:16px;flex:none;text-align:right;color:var(--secondary)}
.ck.on .t{color:var(--secondary);text-decoration:line-through}
.cbox textarea{display:block;width:100%;min-height:72px;border:1px solid var(--rule);padding:8px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--raised)}
.cbox{padding:12px}
.acts-r{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.checkp{border-top:4px solid var(--yellow)}
.cp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cp-sq{display:block;width:8px;height:8px;background:var(--magenta);flex:none}
.cp-n{color:var(--secondary);font-weight:500}
.cp-from{margin-left:auto;font-size:var(--t-meta);font-weight:500;letter-spacing:0;text-transform:none;color:var(--secondary)}
.card .cp-lead{margin-bottom:4px}
.cp-acts{display:flex;gap:8px;margin-top:12px}
.cp-note{flex:1;min-width:0;display:block}
.cp-note input{width:100%;height:30px;border:1px solid var(--rule);padding:0 12px;font-size:var(--t-small);background:var(--sunken)}
.card .cp-ex{margin:8px 0 0;font-size:var(--t-meta);color:var(--secondary);line-height:1.5}
.cp-done{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:var(--t-small)}
.rtag{display:inline-flex;align-items:center;height:18px;padding:0 6px;font-size:10px;font-weight:700;letter-spacing:.08em;background:var(--green);color:var(--ink)}
.steps{padding:0;overflow:hidden}
.steps-h{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 16px;border:0;background:var(--ink);color:var(--yellow);font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;--od-icon-size:14px}
.steps-h .chev{margin-left:auto;transition:transform var(--dur) ease-out}
.steps-h[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.step + .step{border-top:1px solid var(--rule)}
.step-h{display:grid;grid-template-columns:20px minmax(0,1fr) auto 14px;align-items:center;gap:12px;width:100%;padding:8px 16px;border:0;background:none;text-align:left;font-size:var(--t-small);line-height:1.45;--od-icon-size:14px}
.step-h .n{color:var(--secondary);text-align:right}
.step-h .chev,.crow-h .chev{transition:transform var(--dur) ease-out}
.step-h[aria-expanded="true"] .chev,.crow-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.step-ok{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--term-green);--od-icon-size:12px}
.step-out{padding:0 16px 12px 48px;font-size:var(--t-meta);color:var(--secondary);line-height:1.5}
.ro3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px;background:var(--raised);border:1px solid var(--rule)}
.ro3 > div{display:flex;flex-direction:column;gap:2px;padding:12px 16px}
.ro3 > div + div{border-left:1px solid var(--rule)}
.ro3 .rl{margin-bottom:4px}
.ro3 b{font-size:14px}
.ro3 span:not(.rl){font-size:var(--t-meta);color:var(--ink)}
.ro3 .ok{color:var(--term-green)}
.ro3 .chip{display:block;width:max-content;margin-top:4px;padding:1px 6px;background:var(--sunken);letter-spacing:.08em}
.prompt{font-size:14px;line-height:1.6;white-space:pre-line}
.prompt.fold{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;overflow:hidden}
.cg{margin-bottom:24px}
.cg-head{display:flex;align-items:center;gap:12px;height:32px;margin-bottom:8px;border-bottom:1px solid var(--ink);font-size:var(--t-meta);color:var(--secondary)}
.cg-title{display:flex;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--blue);font-size:14px;font-weight:600;--od-icon-size:12px}
.cg-title .chev-r{transform:rotate(-90deg)}
.cg-fail{color:var(--term-red);font-weight:600}
.cg-head .ib{margin-left:auto;width:24px;height:24px;background:none;--od-icon-size:14px}
.cg-head .ib[aria-expanded="false"] svg{transform:rotate(-90deg)}
.crow{margin-bottom:4px;background:var(--raised);border:1px solid var(--rule);box-shadow:inset 3px 0 0 var(--term-green);overflow:hidden}
.crow.fail{box-shadow:inset 3px 0 0 var(--term-red)}
.crow-h{display:grid;grid-template-columns:56px minmax(0,1fr) auto 72px 14px;align-items:center;gap:12px;width:100%;padding:6px 12px 6px 16px;border:0;background:none;text-align:left;--od-icon-size:14px}
.ctool{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary)}
.ccmd{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;color:var(--ink)}
.cm-wrap .ccmd{white-space:pre-wrap;word-break:break-all}
.cexit{font-size:var(--t-label);color:var(--secondary);white-space:nowrap}
.crow.fail .cexit{padding:1px 6px;background:var(--term-red);color:var(--raised);font-weight:600}
.cdur{font-size:var(--t-meta);color:var(--secondary);text-align:right;white-space:nowrap}
.cout{padding:0 16px 10px 84px}
.cout pre{margin:0;padding:8px 12px;background:var(--sunken);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}
.cout p{margin:0;font-size:var(--t-meta);color:var(--secondary)}
@media (hover:hover){
  .crow-h:hover,.step-h:hover{background:var(--paper)}
  .linkbtn:hover,.cg-title:hover{text-decoration:underline}
}

/* a2: B2 rounded */
.skin-a2 .sel,.skin-a2 .cbox textarea,.skin-a2 .cp-note input,.skin-a2 .crow{border-radius:8px}

.skin-a2 .lsh-btn{width:calc(100% - 16px)}
.skin-a2 .lsh-btn .chev{margin-left:8px;color:var(--yellow)}
.skin-a2 .ro3 > div + div{border-left-color:var(--rule)}

/* a3: Endfield-faithful */

.skin-a3 .card,.skin-a3 .ro3,.skin-a3 .crow{background:rgba(255,255,255,.88)}
.skin-a3 .cp-note input{background:var(--raised);border-color:var(--contour)}
.skin-a3 .seg button{border-radius:0;color:var(--secondary)}
.skin-a3 .seg button:first-child{border-radius:4px 0 0 4px}
.skin-a3 .seg button:last-child{border-radius:0 4px 4px 0;border-left:0}
.skin-a3 .seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);border-color:var(--contour);box-shadow:inset 0 -2px 0 var(--yellow)}
.skin-a3 .lsh-btn{width:100%}
.skin-a3 .lsh-btn .chev{color:var(--secondary)}
.skin-a3 .ptag{background:var(--sunken);color:var(--ink);font-weight:600;border-radius:3px}
.skin-a3 .okt{background:var(--raised);border:1px solid var(--rule);border-radius:3px;font-size:10px}
.skin-a3 .rtag{background:var(--raised);border:1px solid var(--rule);border-radius:3px;box-shadow:inset 2px 0 0 var(--term-green);padding-left:8px;font-weight:600}
.skin-a3 .rostrip{background:rgba(255,255,255,.72)}
.skin-a3 .card-h{font-weight:600;font-size:15px}
.skin-a3 .card-by,.skin-a3 .cp-head{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--secondary)}
.skin-a3 .card-by::before,.skin-a3 .card-lbl::before{content:"// "}
.skin-a3 .card-lbl{border-bottom-color:var(--rule);font-weight:600;letter-spacing:.14em;color:var(--secondary)}
.skin-a3 .card-sub{font-weight:600}
.skin-a3 .checkp{border-top:1px solid var(--rule);box-shadow:inset 0 2px 0 var(--yellow),0 0 12px rgba(255,250,0,.25)}
.skin-a3 .cp-sq{transform:rotate(45deg);width:7px;height:7px}
.skin-a3 .steps-h{background:none;color:var(--secondary);border-bottom:1px solid var(--rule);font-size:10px;font-weight:600;letter-spacing:.14em}
.skin-a3 .steps-h::before{content:"//"}
.skin-a3 .cg-head{border-bottom-color:var(--contour)}
.skin-a3 .ro3 .chip{border-radius:3px}
.skin-a3 .crow.fail .cexit{background:none;color:var(--term-red);padding:0}
.skin-a3 .step-h,.skin-a3 .crow-h{padding-top:5px;padding-bottom:5px}

.skin-b .lc{background:var(--raised)}

.skin-b .lc-search{border-radius:8px}
.skin-b .lc-search:focus-within{outline-offset:1px}

/* ======== messages, mission style (a3-m1 objectives, a3-m2 mission cards) ======== */
.msn .dt-scroll{padding:20px 28px 16px}
.msn .col{max-width:668px}
.msn .lbl{display:flex;align-items:center;gap:8px;height:16px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--secondary);white-space:nowrap}
.msn .lbl .num{letter-spacing:.04em;font-weight:500}
.msn .lbl .ln{flex:1;height:1px;background:var(--contour)}
.msn .lbl b{color:var(--ink);font-weight:600}
.msn .sq{flex:none;display:grid;place-items:center;width:12px;height:12px;border:1.5px solid var(--secondary);background:var(--raised);color:var(--raised);--od-icon-size:10px;box-sizing:border-box}
.msn .sq svg{stroke-width:2.6}
.msn .is-done>.sq,.msn .sq.done{background:var(--dark-panel);border-color:var(--dark-panel)}
.msn .is-run>.sq,.msn .sq.run{background:var(--yellow);border-color:var(--ink)}
.msn .is-fail>.sq,.msn .sq.fail{background:var(--term-red);border-color:var(--term-red)}
.msn .is-appr>.sq,.msn .sq.appr{background:var(--magenta);border-color:var(--magenta)}
.msn mark{display:inline-block;background:none;color:var(--ink);font-weight:600;line-height:1.25;padding:0 1px;box-shadow:inset 0 -6px 0 rgba(255,250,0,.95)}
.msn .hermes{padding:0;font-size:15px;line-height:1.6}
.msn .hermes p{margin:0 0 10px}
.msn .hermes ul,.msn .hermes ol{margin:0 0 10px}
.msn .hermes pre{margin:0 0 10px}
.msn .hermes pre code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px}
/* the objective: your message as a band, its square outside on the left */
.msn .obj{position:relative;display:flex;align-items:flex-start;gap:12px;margin:18px 0 12px}
.msn .obj>.sq{margin-top:14px}
.msn .band{position:relative;flex:1;display:flex;align-items:baseline;gap:16px;min-height:42px;padding:10px 14px;background:rgba(255,255,255,.92);border-radius:4px;font-size:15px;font-weight:500;line-height:1.45}
.msn .band p{margin:0;flex:1}
.msn .band .tm{flex:none;font-size:11px;font-weight:400;color:var(--secondary)}
.msn .ovtag{position:absolute;top:-10px;right:10px}
.msn .ovtag .stk{height:18px;box-shadow:0 1px 4px rgba(25,25,25,.12)}
.msn .reply{margin-left:24px}
.msn .reply>.lbl{margin:0 0 8px}
/* steps: the run's tool calls as sub-objectives */
.msn .steps{margin:6px 0 4px;border-top:1px solid var(--rule)}
.msn .st{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px 0 2px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink);--od-icon-size:14px}
.msn .st .sq{width:10px;height:10px;--od-icon-size:8px}
.msn .st .tool{flex:none;width:66px;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--secondary)}
.msn .st code{flex:1;min-width:0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msn .st .d{flex:none;font-size:11px;color:var(--secondary)}
.msn .st.is-run{font-weight:600}
.msn .st.is-run .d{color:var(--ink);font-weight:600}
.msn .st.is-fail .d{color:var(--term-red);font-weight:600}
.msn .st.sum b{font-weight:600}
.msn .st.sum .d{margin-right:auto}
.msn .st .chev{color:var(--secondary)}
/* results: what the turn produced, as tiles with a coloured foot bar */
.msn .res{display:flex;align-items:flex-end;gap:8px;margin:14px 0 6px}
.msn .res>.lbl{flex:1;align-self:flex-end;margin-bottom:6px}
.msn .tile{position:relative;flex:none;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;width:80px;height:74px;padding:8px 9px 10px;background:var(--raised);border:1px solid var(--rule);border-radius:4px;box-shadow:inset 0 -3px 0 var(--bar);--od-icon-size:16px;color:var(--secondary);box-sizing:border-box}
.msn .tile .n{display:block;margin-top:auto;font-size:20px;font-weight:500;line-height:20px;color:var(--ink)}
.msn .tile .w{display:block;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;line-height:10px;margin-top:-2px}
.msn .t-ok{--bar:var(--term-green)}
.msn .t-fail{--bar:var(--term-red)}
.msn .t-link{--bar:var(--blue)}
.msn .t-file{--bar:var(--dark-panel)}
.msn .t-meta{--bar:var(--contour)}
.msn .working{margin:2px 0 0;gap:8px}
.msn .working::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--yellow) 0 34%,var(--rule) 34% 100%)}
/* approval block */
.msn .approve{margin:8px 0 4px;padding:12px 14px;background:var(--raised);border:1px solid var(--rule);border-radius:4px;box-shadow:inset 3px 0 0 var(--magenta)}
.msn .approve .hd{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--secondary)}
.msn .approve pre{background:var(--sunken);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;margin:0 0 12px}
.msn .approve pre code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px}
.msn .approve pre .p{color:var(--term-green)}
.msn .btn-deny{background:var(--raised);color:var(--term-red);border-color:var(--term-red)}
/* composer: the game's Track button as the send row */
.msn .composer{padding:10px 16px 12px}
.msn .runline{margin-bottom:8px}
.msn .track{display:flex;align-items:center;gap:8px;height:46px;padding:0 5px 0 10px;background:var(--raised);border:1px solid var(--contour);border-radius:23px}
.msn .track input{flex:1;min-width:0;height:36px;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);outline:0;padding:0 4px}
.msn .track input::placeholder{color:var(--secondary)}
.msn .track .ib-clip{width:30px;height:30px;border:0;background:none;color:var(--secondary);--od-icon-size:16px;display:grid;place-items:center}
.msn .stopc{flex:none;display:grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid var(--rule);border-radius:50%;background:var(--raised)}
.msn .stopc i{display:block;width:10px;height:10px;background:var(--term-red)}
.msn .trk{flex:none;display:flex;align-items:center;gap:12px;height:36px;padding:0 4px 0 16px;border:1px solid var(--yellow);border-radius:18px;background:var(--yellow);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--ink);text-transform:uppercase}
.msn .trk.plain{background:var(--raised);border-color:var(--rule)}
.msn .trk .ring{display:grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--ink);border-radius:50%;box-sizing:border-box;--od-icon-size:14px}
.msn .trk.plain .ring{border-color:var(--secondary)}
/* a3-m2: every turn a mission card, your words as its title */
.msn2 .mc{position:relative;margin:0 0 14px;padding:14px 16px 12px 20px;background:rgba(255,255,255,.9);border:1px solid var(--rule);border-radius:4px;box-shadow:inset 3px 0 0 var(--bar,var(--contour))}
.msn2 .mc.is-done{--bar:var(--term-green)}
.msn2 .mc.is-run{--bar:var(--yellow);border-color:var(--contour)}
.msn2 .mc.is-fail{--bar:var(--term-red)}
.msn2 .mc.is-appr{--bar:var(--magenta)}
.msn2 .mc-h{display:flex;align-items:flex-start;gap:12px}
.msn2 .mc-h>.sq{margin-top:7px}
.msn2 .mc-t{flex:1;min-width:0}
.msn2 .mc h3{margin:0;font-size:19px;font-weight:500;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msn2 .loc{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--secondary);white-space:nowrap}
.msn2 .loc .pin{flex:none;width:8px;height:8px;background:var(--yellow);box-shadow:0 0 0 1px var(--ink)}
.msn2 .loc b{font-weight:600;color:var(--ink)}
.msn2 .mc .fold{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:4px;background:var(--raised);color:var(--secondary);--od-icon-size:14px;padding:0}
.msn2 .mc-rule{height:1px;margin:12px 0 12px 24px;background:var(--rule)}
.msn2 .mc-b{margin-left:24px}
.msn2 .mc.folded{padding-top:10px;padding-bottom:10px}
.msn2 .mc.folded h3{font-size:15px;-webkit-line-clamp:1}

/* ---------- contour lines ---------- */
function contours(w, h) {
  const cx = w * .78, cy = h * .72, m = Math.min(w, h);
  let out = '';
  for (let k = 1; k <= 18; k++) {
    const r0 = k * m * .045;
    let d = '';
    for (let i = 0; i <= 180; i++) {
      const t = i / 180 * Math.PI * 2;
      const r = r0 * (1 + .045 * Math.sin(3 * t + k * .7) + .03 * Math.sin(5 * t + k * 1.3) + .02 * Math.sin(7 * t + k * .4));
      d += `${i ? 'L' : 'M'}${(cx + r * Math.cos(t) * 1.35).toFixed(1)} ${(cy + r * Math.sin(t)).toFixed(1)}`;
    }
    out += `<path d="${d}Z" stroke="#C8C8C0" stroke-width="1" fill="none" opacity="${k % 5 === 0 ? .9 : .55}"/>`;
  }
  return `<svg class="contours" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${out}</svg>`;
}

function mcEmblem(src) {
  const g = src === 'cron' ? ic('cron') : src === 'telegram' ? ic('telegram') : src === 'terminal' ? ic('terminal') : '<b>T</b>';
  return `<span class="mc-emb" aria-hidden="true"><span class="tri">${ic('tri')}</span><span class="gl">${g}</span></span>`;
}
function mcTag(c) {
  if (!c.state) return '';
  if (c.state === 'run') return `<span class="mc-tag run">${ic('clock2')}<span class="num" data-run="${c.id}">${mmss(c.run)}</span></span>`;
  const glyph = {approval: 'diamond', failed: 'cross', done: 'check'}[c.state];
  return `<span class="mc-tag ${c.state}">${ic(glyph)}<span>${STATE_WORD[c.state]}</span></span>`;
}
function missionRow(c, selId, extra = '') {
  const sel = selId === c.id;
  return `<button class="row mc-row ${c.state ? 'is-' + c.state : ''} ${sel ? 'is-sel' : ''} ${c.state || sel ? 'is-strong' : ''} ${extra}" type="button" data-act="row" data-id="${c.id}" data-key="row-${c.id}" ${sel ? 'aria-current="true"' : ''}
      aria-label="${esc(c.title)}, ${c.state ? STATE_LONG[c.state] + ', ' : ''}${esc(c.time)}${c.pinned ? ', pinned' : ''}">
    ${mcTag(c)}${mcEmblem(c.src)}<span class="mc-div" aria-hidden="true"></span>
    <span class="mc-body">
      <span class="mc-title"><span class="t">${esc(c.title)}</span>${c.pinned ? `<span class="pin">${ic('pin')}</span>` : ''}</span>
      <span class="mc-sub">${c.readOnly || c.src === 'cron' ? `<span class="lock">${ic('lock')}</span>` : ''}<span class="p">${esc(c.preview)}</span></span>
    </span>
    <span class="mc-side"><span class="mc-time num">${esc(c.time)}</span><span class="mc-hatch" aria-hidden="true"></span></span>
  </button>`;
}
function missionHead(label, n, glyph) {
  if (label === 'In progress') return `<div class="mg ip" role="presentation"><i class="ln" aria-hidden="true"></i><span class="ml">In progress</span><span class="br" aria-hidden="true"></span></div>`;
  return `<div class="mg" role="presentation"><span class="ms" aria-hidden="true">${ic(glyph || (label === 'Pinned' ? 'pin' : 'chat'))}</span><span class="ml">${esc(label)}</span><span class="mn num">${n}</span></div>`;
}

/* ---------- pieces ---------- */
function sticker(state, conv, glyphOnly) {
  if (!state) return '';
  const g = `<span class="g">${ic(STATE_GLYPH[state])}</span>`;
  if (glyphOnly) return `<span class="stk go stk-${state}" role="img" aria-label="${STATE_LONG[state]}" data-tip="${STATE_LONG[state]}">${g}</span>`;
  const t = state === 'run' ? `<span class="t num" data-run="${conv.id}">${mmss(conv.run)}</span>` : '';
  return `<span class="stk stk-${state}">${g}<span class="w">${STATE_WORD[state]}${t}</span></span>`;
}
function avatar(src) {
  if (src === 'cron') return `<span class="av av-cron" aria-hidden="true">${ic('cron')}</span>`;
  if (src === 'telegram') return `<span class="av av-telegram" aria-hidden="true">${ic('telegram')}</span>`;
  if (src === 'terminal') return `<span class="av av-terminal" aria-hidden="true">${ic('terminal')}</span>`;
  return `<span class="av av-app" aria-hidden="true">T</span>`;
}

function rowMarkup(c, selId, extra = '', idx = null) {
  if (MCARDS) return missionRow(c, selId, extra);
  const sel = selId === c.id;
  const tags = c.tags.slice(0, 2).map(t => `<span class="tag">${esc(t)}</span>`).join('') + (c.tags.length > 2 ? `<span class="tag-more num">+${c.tags.length - 2}</span>` : '');
  return `<button class="row ${sel ? 'is-sel on-dark' : ''} ${c.state || sel ? 'is-strong' : ''} ${extra}" type="button" data-act="row" data-id="${c.id}" data-key="row-${c.id}" ${sel ? 'aria-current="true"' : ''}
      aria-label="${esc(c.title)}, ${c.state ? STATE_LONG[c.state] + ', ' : ''}${esc(c.time)}${c.pinned ? ', pinned' : ''}">
    ${idx != null ? `<span class="idx num" aria-hidden="true">${String(idx).padStart(2, '0')}</span>` : ''}${avatar(c.src)}
    <span class="row-body">
      <span class="hatch" aria-hidden="true"></span>
      <span class="row-l1"><span class="row-title od-truncate">${esc(c.title)}</span><span class="row-time num">${esc(c.time)}</span></span>
      <span class="row-l2"><span class="row-prev od-truncate">${esc(c.preview)}</span>${c.readOnly ? `<span class="lock" title="Read-only">${ic('lock')}</span>` : ''}${tags}${sticker(c.state, c)}${c.pinned ? `<span class="pin">${ic('pin')}</span>` : ''}</span>
    </span>
    <span class="fr" aria-hidden="true"><i class="nd tl"></i><i class="nd tr"></i><i class="nd bl"></i><i class="nd br"></i></span>
  </button>`;
}

          <button type="button" data-act="gh-view" data-v="board" data-key="gh-v-board" aria-pressed="${g.view === 'board'}" data-tip="Board by status">${ic('board')}<span>Board</span></button>
          <button type="button" data-act="gh-view" data-v="check" data-key="gh-v-check" aria-pressed="${g.view === 'check'}" data-tip="Needs your check">${ic('eye')}<span class="num">Needs check 11</span></button>
        </div>`;
      const fit = it => (g.prio === 'any' || ghPrio(it) === g.prio) && (!q || it.t.toLowerCase().includes(q) || String(it.n).includes(q.replace('#', '')));
      if (g.repo !== 'all' && g.repo !== 'trismegistus-mac') { lcScroll.innerHTML = emptyNote(`No issues from ${esc(g.repo)}`, 'The Work board in this sample holds trismegistus-mac only. Pick All repos.'); return; }
      if (g.view === 'check') {
        const items = GH_GROUPS.find(x => x.id === 'check').items.filter(fit);
        lcScroll.innerHTML = items.length ? `${secHead('trismegistus-mac', 11)}${items.map(it => ghIssueRow(it, g.csel)).join('')}<div class="more-note num">4 more need your check; they aren’t in this sample.</div>`
          : emptyNote('Nothing matches', 'Clear the filter or the priority.');
        return;
      }
      let html = '';
      GH_GROUPS.forEach(gr => {
        if (gr.id === 'done') {
          html += secHead('Done', gr.n, {act:'gh-done', open:g.doneOpen});
          if (g.doneOpen) html += `<div class="more-note num">54 closed issues. They aren’t in this prototype’s sample.</div>`;
          return;
        }
        const items = gr.items.filter(fit);
        if (!items.length && (q || g.prio !== 'any')) return;
        html += secHead(gr.label, gr.n) + items.map(it => ghIssueRow(it, g.sel)).join('');
        if (gr.id === 'check' && !q && g.prio === 'any') html += `<div class="more-note num">4 more need your check; they aren’t in this sample.</div>`;
      });
      lcScroll.innerHTML = html;
    }
    else if (st.section === 'agents') {
      lcTitle.innerHTML = title('Agents', 0, ' running');
      const runs = AG_RUNS.filter(r => !q || r.title.toLowerCase().includes(q) || r.run.includes(q));
      lcScroll.innerHTML = runs.length ? secHead('Finished', AG_RUNS.length) + runs.map(r => secRow({act:'ag-run', id:r.id, sel:st.ag.sel === r.id, av:secAv('agents'),
        title:r.title, label:`${r.title}, success, ${r.when}`, right:`<span class="row-time num">${esc(r.time)}</span>`,
        l2:`<span class="row-prev od-truncate num">${esc(r.run)} · opus${r.dur ? ' · ' + r.dur : ''}</span>${okTag('success')}`})).join('')
        : emptyNote('No run matches', 'Clear the filter to see all 6.');
    }
    else if (st.section === 'jobs') {
      lcTitle.innerHTML = title('Jobs', JOBS.length);
      const jobs = JOBS.filter(j => !q || j.title.toLowerCase().includes(q));
      lcScroll.innerHTML = jobs.length ? secHead('Scheduled', JOBS.length) + jobs.map(j => {
        const paused = st.jb.paused[j.id];
        return secRow({act:'jb-job', id:j.id, sel:st.jb.sel === j.id, av:secAv('cron'), title:j.title, label:`${j.title}, ${j.cad}, ${paused ? 'paused' : 'last ok ' + j.last}`,
          right:`<span class="row-time num">${paused ? 'paused' : 'ok ' + j.last}</span>`,
          l2:`<span class="row-prev od-truncate num">${j.cad} · next ${paused ? '—' : j.next}</span>${j.script ? '<span class="tag">script only</span>' : ''}${j.tg ? '<span class="tag">Telegram</span>' : ''}${paused ? okTag('paused', 'paused') : okTag('ok')}`});
      }).join('') : emptyNote('No job matches', 'Clear the filter to see all 5.');
    }
    else if (st.section === 'commands') {
      const all = CMD_GROUPS.flatMap(g => g.calls);
      lcTitle.innerHTML = title('Commands', all.length);
      const failed = arr => arr.filter(c => c.exit !== 0).length;
      const rows = [{id:'all', title:'All conversations', calls:all}, ...CMD_GROUPS].filter(g => !q || g.title.toLowerCase().includes(q) || g.calls.some(c => c.cmd.toLowerCase().includes(q)));
      lcScroll.innerHTML = rows.length ? secHead('By conversation', CMD_GROUPS.length) + rows.map(g => secRow({act:'cm-sel', id:g.id, sel:st.cm.sel === g.id, av:secAv('cmd'), title:g.title,
        label:`${g.title}, ${g.calls.length} calls`, right:`<span class="row-time num">${g.calls.length} calls</span>`,
        l2:`<span class="row-prev od-truncate num">${failed(g.calls) ? `${failed(g.calls)} failed` : 'no failures'}</span>`})).join('')
        : emptyNote('No command matches', 'Search looks at conversation names and command text.');
    }
  }

  /* ----- details ----- */
  function detailHead({icon, title: t, sub, acts = ''}) {
    return `<header class="dt-head">
        ${secAv(icon)}
        <div class="dt-ttl"><span class="t1"><span class="od-truncate">${esc(t)}</span></span><span class="t2 od-truncate num">${esc(sub)}</span></div>
        <div class="dt-acts">${acts}</div>
        <div class="dt-tools">
          <button class="ib" type="button" data-act="toast" data-msg="Settings open in their own window  ⌘," data-key="settings" aria-label="Settings" data-tip="Settings  ⌘,">${ic('sliders')}</button>
          <button class="ib" type="button" data-act="menu" data-menu="sec" data-key="dt-more" aria-label="More actions" aria-haspopup="menu" data-tip="More">${ic('more')}</button>
        </div>
      </header>
      <div class="dt-rule" aria-hidden="true"><i class="m"></i><i class="y"></i><i class="g"></i><i class="hz"></i></div>`;
  }
  function ghStrip(it) {
    const opts = (list, cur) => list.map(v => `<option ${v === cur ? 'selected' : ''}>${v}</option>`).join('');
    return `<div class="rostrip">
      <label class="ro"><span class="rl">Status</span><select class="sel" data-ch="gh-status" data-n="${it.n}" data-key="gh-status">${opts(['Todo','Ready','In progress','Needs check','Done'], ghStatus(it))}</select></label>
      <label class="ro"><span class="rl">Priority</span><select class="sel" data-ch="gh-prio" data-n="${it.n}" data-key="gh-prio">${opts(['P1','P2','P3'], ghPrio(it))}</select></label>
      <div class="ro"><span class="rl">Tags</span>${(it.tags || ['none']).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="ro"><span class="rl">Agent</span><span class="tag">${esc(st.gh.dispatched && it.n === 66 ? 'opus · queued' : it.agent || 'none')}</span></div>
      <button class="btn btn-line ro-end" type="button" data-act="toast" data-msg="Close issue asks for confirmation first" data-key="gh-close">Close issue ${ic('tick')}</button>
    </div>`;
  }
  const commentBox = n => `<div class="card cbox"><label><span class="sr">Comment on GitHub</span><textarea data-in="gh-comment" data-key="gh-comment" placeholder="Comment on GitHub"></textarea></label>
      <div class="acts-r"><button class="btn btn-line" type="button" data-act="gh-comment" data-n="${n}" data-key="gh-comment-send" disabled>Comment ${ic('up')}</button></div></div>`;
  function renderSecDetail() {
    let html = '';
    const sec = st.section;
    if (sec === 'github') {
      const g = st.gh, n = g.view === 'check' ? g.csel : g.sel, it = GH_ALL.find(x => x.n === n);
      const checks = g.checks[n] || [];
      const done = checks.filter(Boolean).length;
      const total = n === 66 ? GH_TASKS.length : n === 68 ? GH_CHECKS.length : 0;
      const acts = `${total ? `<span class="ro-mini num" aria-label="${done} of ${total} done">${ic('tick')}${done}/${total}</span>` : ''}
        <button class="ib" type="button" data-act="toast" data-msg="Opens xMuramasa/trismegistus-mac#${n} on GitHub" data-key="gh-ext" aria-label="Open on GitHub" data-tip="Open on GitHub">${ic('ext')}</button>
        <button class="btn btn-line" type="button" data-act="toast" data-msg="Starts a Chat conversation about #${n}" data-key="gh-conv">Start conversation ${ic('chat')}</button>
        ${n === 66 ? `<button class="btn btn-mark" type="button" data-act="gh-dispatch" data-key="gh-dispatch" ${g.dispatched ? 'disabled' : ''}>${g.dispatched ? 'Dispatched' : 'Dispatch'} ${ic('play')}</button>` : ''}`;
      html = detailHead({icon:'pr', title:it.t, sub:`xMuramasa/trismegistus-mac#${n} · open · ${ghStatus(it)}`, acts}) + ghStrip(it);
      let body = '';
      if (n === 66) {
        body = `<div class="card">
          <div class="card-by">xMuramasa</div>
          <h2 class="card-h">${esc(it.t)}</h2>
          <h3 class="card-sub">Decisions<span class="num">13</span></h3>
          <table class="dtable"><tbody>${GH_DECISIONS.map((d, i) => `<tr><td class="num">${i + 1}</td><td>${esc(d)}</td></tr>`).join('')}</tbody></table>
          ${g.decAll ? `<p class="note">The other 9 decisions are in the issue body on GitHub; this prototype holds the first 4.</p>` : ''}
          <button class="linkbtn" type="button" data-act="gh-dec" data-key="gh-dec" aria-expanded="${g.decAll}">${g.decAll ? 'Show fewer' : 'Show all 13 decisions'} ${ic('chev', 'chev')}</button>
          <h3 class="card-sub">Checklist<span class="num">${done}/${total} done</span></h3>
          <div class="cklist">${GH_TASKS.map((t, i) => `<label class="ck ${checks[i] ? 'on' : ''}"><input type="checkbox" data-ch="gh-ck" data-n="66" data-i="${i}" data-key="ck-66-${i}" ${checks[i] ? 'checked' : ''}><span class="t">${esc(t)}</span></label>`).join('')}</div>
        </div>${commentBox(66)}`;
      } else if (n === 68) {
        const v = g.verdict;
        body = `<div class="card checkp">
          <div class="cp-head"><span class="cp-sq" aria-hidden="true"></span><span>Needs your check</span><span class="num cp-n">${done}/${total}</span><span class="cp-from num">From Hermes · 10 Nov 11:26</span></div>
          <p class="cp-lead">On screen for Martin:</p>
          <div class="cklist">${GH_CHECKS.map((t, i) => `<label class="ck ${checks[i] ? 'on' : ''}"><span class="n num">${i + 1}</span><input type="checkbox" data-ch="gh-ck" data-n="68" data-i="${i}" data-key="ck-68-${i}" ${checks[i] ? 'checked' : ''}><span class="t">${esc(t)}</span></label>`).join('')}</div>
          ${v === 'good' ? `<div class="cp-done">${okTag('confirmed')}<span>Commented “Confirmed on screen by Martin.” · Status Done</span></div>`
          : v === 'bad' ? `<div class="cp-done"><span class="stk stk-failed"><span class="g">${ic('cross')}</span><span class="w">Not right</span></span><span>Your note is posted as a comment · Status Todo</span></div>`
          : `<div class="cp-acts">
              <button class="btn btn-mark" type="button" data-act="gh-good" data-key="gh-good">Looks good ${ic('tick')}</button>
              <label class="cp-note"><span class="sr">What’s not right</span><input type="text" data-in="gh-note" data-key="gh-note" placeholder="What’s not right? (posted as a comment)" value="${esc(g.note)}"></label>
              <button class="btn btn-line" type="button" data-act="gh-bad" data-key="gh-bad" ${g.note.trim() ? '' : 'disabled'}>Not right ${ic('cross')}</button>
            </div>`}
          <p class="cp-ex">Looks good: comments “Confirmed on screen by Martin.”, Status Done. Not right: comments your note, reopens the issue if closed, Status Todo.</p>
        </div>
        <div class="card"><div class="card-by">Delegate run</div>
          <p class="num">run_trismegistus-mac-issue-68 · opus · finished 11:20 · 34 min · success</p>
          <button class="linkbtn" type="button" data-act="goto-run" data-id="r68" data-key="goto-run">Open the run in Agents ${ic('arrow')}</button></div>`;
      } else {
        body = `<div class="card"><div class="card-by">xMuramasa</div><h2 class="card-h">${esc(it.t)}</h2>
          <p class="note">The body of #${n} isn’t part of this prototype’s sample. #66 (Ready) and #68 (Needs check) are drawn in full.</p></div>${commentBox(n)}`;
      }
      html += `<div class="dt-scroll"><div class="col">${body}</div></div>`;
    }
    else if (sec === 'agents') {
      const r = AG_RUNS.find(x => x.id === st.ag.sel);
      const acts = `${r.issue ? `<button class="btn btn-line" type="button" data-act="goto-issue" data-n="${r.issue}" data-key="goto-issue">Open issue #${r.issue} ${ic('ext')}</button>` : ''}
        <button class="ib" type="button" data-act="toast" data-msg="The transcript opens in a sheet" data-key="ag-tr" aria-label="Transcript" data-tip="Transcript">${ic('lines')}</button>`;
      html = detailHead({icon:'agents', title:r.run, sub:`success · delegate · opus · ${r.when}${r.turns ? ` · ${r.turns} turns` : ''}${r.dur ? ` · ${r.dur}` : ''} · optiplex`, acts});
      let body = `<div class="card result">
          <div class="cp-head"><span>Result</span><span class="rtag">Success</span><span class="cp-from num">${r.turns ? `${r.turns} turns · ` : ''}${r.dur ? `${r.dur} · ` : ''}${esc(r.when)}</span></div>
          <p>${r.result ? esc(r.result) : 'The result text and steps for this run aren’t part of this prototype’s sample; run #68 is drawn in full.'}</p></div>`;
      if (r.steps) {
        body += `<div class="card steps">
          <button class="steps-h" type="button" data-act="ag-steps" data-key="ag-steps" aria-expanded="${st.ag.stepsOpen}"><span class="num">${r.steps.length} steps · 0 failed</span>${ic('chev', 'chev')}</button>
          <div ${st.ag.stepsOpen ? '' : 'hidden'}>${r.steps.map((s, i) => {
            const o = !!st.ag.open[i];
            return `<div class="step"><button class="step-h" type="button" data-act="ag-step" data-i="${i}" data-key="ag-step-${i}" aria-expanded="${o}"><span class="n num">${i + 1}</span><span class="st">${esc(s)}</span><span class="step-ok">${ic('tick')}ok</span>${ic('chev', 'chev')}</button>
              <div class="step-out" ${o ? '' : 'hidden'}>Output folded. The full step output lives in the run’s progress file, ~/.local/state/hermes-runs/trismegistus-mac-issue-68-progress.md; it isn’t part of this sample.</div></div>`;
          }).join('')}</div></div>`;
      }
      html += `<div class="dt-scroll"><div class="col">${body}</div></div>`;
    }
    else if (sec === 'jobs') {
      const j = JOBS.find(x => x.id === st.jb.sel), paused = st.jb.paused[j.id];
      const acts = `<button class="btn btn-line" type="button" data-act="jb-pause" data-key="jb-pause">${paused ? 'Resume' : 'Pause'} ${ic(paused ? 'play' : 'pause')}</button>
        <button class="btn btn-mark" type="button" data-act="toast" data-msg="${esc(j.title)} started — it shows here as running" data-key="jb-run">Run now ${ic('play')}</button>
        <button class="btn btn-line" type="button" data-act="toast" data-msg="Edit opens the job editor" data-key="jb-edit">Edit ${ic('edit')}</button>`;
      html = detailHead({icon:'cron', title:j.title, sub:`${paused ? 'paused' : 'scheduled'} · next ${paused ? '—' : j.nexts[0]} · last ok ${j.lastLong}${j.model ? ` · ${j.model} · ${j.extra}` : ''}${j.script ? ' · script only' : ''}`, acts});
      let body = `<div class="ro3 card-like">
          <div><span class="rl">Cadence</span><b>${j.cadLong}</b><span class="chip num">${esc(j.cron)}</span></div>
          <div><span class="rl">Next 3 runs</span>${paused ? '<span>Paused — no runs scheduled</span>' : j.nexts.map(x => `<span class="num">${x}</span>`).join('')}</div>
          <div><span class="rl">Last result</span><b class="ok">ok</b><span class="num">${j.lastLong}</span></div>
        </div>`;
      if (j.prompt) body += `<div class="card"><div class="card-lbl">Prompt</div>
          <div class="prompt ${st.jb.promptAll ? '' : 'fold'}">${esc(j.prompt)}</div>
          <button class="linkbtn" type="button" data-act="jb-prompt" data-key="jb-prompt" aria-expanded="${st.jb.promptAll}">${st.jb.promptAll ? 'Show less' : 'Show all'} ${ic('chev', 'chev')}</button></div>`;
      else body += `<div class="card"><div class="card-lbl">${j.script ? 'Script' : 'Prompt'}</div><p class="note">${j.script ? `Script only: no model and no prompt.${j.tg ? ' Delivers to Telegram.' : ''}` : 'This job’s prompt isn’t part of this prototype’s sample; Daily AI news feed is drawn in full.'}</p></div>`;
      html += `<div class="dt-scroll"><div class="col">${body}</div></div>`;
    }
    else if (sec === 'commands') {
      const c = st.cm, groups = c.sel === 'all' ? CMD_GROUPS : CMD_GROUPS.filter(g => g.id === c.sel);
      const all = groups.flatMap(g => g.calls), nf = all.filter(x => x.exit !== 0).length;
      const acts = `<button class="btn btn-line" type="button" data-act="cm-one" data-key="cm-one" aria-pressed="${c.oneLine}">One line ${ic('lines')}</button>
        <button class="btn btn-line" type="button" data-act="cm-failed" data-key="cm-failed" aria-pressed="${c.failedOnly}">Failed ${ic('warn')}</button>`;
      html = detailHead({icon:'cmd', title:c.sel === 'all' ? 'All conversations' : groups[0].title, sub:`${all.length} calls · ${nf} failed · durations approximate`, acts});
      const body = groups.map(g => {
        const calls = g.calls.filter(x => !c.failedOnly || x.exit !== 0);
        if (!calls.length) return '';
        const gf = g.calls.filter(x => x.exit !== 0).length, folded = c.fold[g.id];
        return `<section class="cg">
          <div class="cg-head"><button class="cg-title" type="button" data-act="${g.conv ? 'goto-conv' : 'cm-sel'}" data-id="${g.conv || g.id}" data-key="cg-${g.id}">${esc(g.title)} ${ic('chev', 'chev-r')}</button>
            <span class="num">${g.calls.length} calls</span>${gf ? `<span class="cg-fail num">${gf} failed</span>` : ''}
            <button class="ib" type="button" data-act="cm-fold" data-id="${g.id}" data-key="cm-fold-${g.id}" aria-expanded="${!folded}" aria-label="${folded ? 'Unfold' : 'Fold'} ${esc(g.title)}">${ic('chev', 'chev')}</button></div>
          <div ${folded ? 'hidden' : ''}>${calls.map(x => {
            const o = !!c.open[x.id], fail = x.exit !== 0;
            return `<div class="crow ${fail ? 'fail' : ''}"><button class="crow-h" type="button" data-act="cm-row" data-id="${x.id}" data-key="cm-${x.id}" aria-expanded="${o}">
                <span class="ctool">terminal</span><code class="ccmd">${esc(x.cmd)}</code><span class="cexit num">exit ${x.exit}${fail ? ' · not found' : ''}</span><span class="cdur num">${x.dur}</span>${ic('chev', 'chev')}</button>
              <div class="cout" ${o ? '' : 'hidden'}>${x.out ? `<pre><code>${esc(x.out)}</code></pre>` : '<p>Output isn’t part of this sample.</p>'}</div></div>`;
          }).join('')}</div></section>`;
      }).join('');
      html += `<div class="dt-scroll"><div class="col cm-col ${c.oneLine ? '' : 'cm-wrap'}">${body || emptyNote('No failed calls', 'Turn Failed off to see every call.')}</div></div>`;
    }
    dt.innerHTML = html;
    dt.querySelector('.dt-scroll').scrollTop = 0;
  }

  /* ----- section actions ----- */
  const reList = () => keepFocus(() => { renderList(); renderDetail(); });
  function secClick(a, el) {
    const g = st.gh;
    switch (a) {
      case 'gh-issue': if (g.view === 'check') g.csel = +el.dataset.id; else g.sel = +el.dataset.id; g.note = ''; reList(); return true;
      case 'gh-view': g.view = el.dataset.v; reList(); return true;
      case 'gh-done': g.doneOpen = !g.doneOpen; keepFocus(renderList); return true;
      case 'gh-dec': g.decAll = !g.decAll; keepFocus(renderDetail); return true;
      case 'gh-dispatch': g.dispatched = true; keepFocus(renderDetail); say('Dispatched #66 to a delegate on optiplex — it shows up in Agents'); return true;
      case 'gh-good': g.verdict = 'good'; g.status[68] = 'Done'; reList(); say('Commented “Confirmed on screen by Martin.” · Status Done'); return true;
      case 'gh-bad': if (!g.note.trim()) return true; g.verdict = 'bad'; g.status[68] = 'Todo'; reList(); say('Note posted as a comment · Status Todo'); return true;
      case 'gh-comment': { const ta = dt.querySelector('textarea'); if (ta && ta.value.trim()) { ta.value = ''; el.disabled = true; say(`Comment posted on #${el.dataset.n}`); } return true; }
      case 'goto-run': st.section = 'agents'; st.ag.sel = el.dataset.id; st.filter = ''; filterInput.value = ''; renderAll(); return true;
      case 'goto-issue': {
        const n = +el.dataset.n, it = GH_ALL.find(x => x.n === n);
        st.section = 'github'; st.filter = ''; filterInput.value = '';
        if (it && ghStatus(it) === 'Needs check') { g.view = 'check'; g.csel = n; } else if (it) { g.view = 'board'; g.sel = n; }
        renderAll(); return true;
      }
      case 'goto-conv': st.section = 'chat'; st.kind = 'app'; st.sel = el.dataset.id; st.filter = ''; filterInput.value = ''; renderAll(); return true;
      case 'ag-run': st.ag.sel = el.dataset.id; st.ag.open = {}; reList(); return true;
      case 'ag-steps': st.ag.stepsOpen = !st.ag.stepsOpen; keepFocus(renderDetail); return true;
      case 'ag-step': st.ag.open[el.dataset.i] = !st.ag.open[el.dataset.i]; keepFocus(renderDetail); return true;
      case 'jb-job': st.jb.sel = el.dataset.id; st.jb.promptAll = false; reList(); return true;
      case 'jb-prompt': st.jb.promptAll = !st.jb.promptAll; keepFocus(renderDetail); return true;
      case 'jb-pause': { const id = st.jb.sel; st.jb.paused[id] = !st.jb.paused[id]; reList(); say(st.jb.paused[id] ? 'Paused — no runs until you resume' : 'Resumed — next run is scheduled'); return true; }
      case 'cm-sel': st.cm.sel = el.dataset.id; reList(); return true;
      case 'cm-row': st.cm.open[el.dataset.id] = !st.cm.open[el.dataset.id]; keepFocus(renderDetail); return true;
      case 'cm-fold': st.cm.fold[el.dataset.id] = !st.cm.fold[el.dataset.id]; keepFocus(renderDetail); return true;
      case 'cm-one': st.cm.oneLine = !st.cm.oneLine; keepFocus(renderDetail); return true;
      case 'cm-failed': st.cm.failedOnly = !st.cm.failedOnly; keepFocus(renderDetail); return true;
    }
    return false;
  }
  function secChange(t) {
    const g = st.gh, k = t.dataset.ch;
    if (!k) return;
    if (k === 'gh-ck') { const n = +t.dataset.n; (g.checks[n] = g.checks[n] || [])[+t.dataset.i] = t.checked; keepFocus(renderDetail); }
    else if (k === 'gh-repo') { g.repo = t.value; keepFocus(renderList); }
    else if (k === 'gh-prio-f') { g.prio = t.value; keepFocus(renderList); }
    else if (k === 'gh-status') { g.status[+t.dataset.n] = t.value; reList(); say(`Status set to ${t.value} on GitHub`); }
    else if (k === 'gh-prio') { g.prioOf[+t.dataset.n] = t.value; reList(); say(`Priority set to ${t.value}`); }
  }
  function secInput(t) {

  }

  function renderAll() { keepFocus(() => { renderPanel(); renderList(); renderDetail(); }); }

  /* overlays */
  function rel(el) {
    const wr = win.getBoundingClientRect(), r = el.getBoundingClientRect(), s = wr.width / win.offsetWidth || 1;
    return {x:(r.left - wr.left) / s, y:(r.top - wr.top) / s, w:r.width / s, h:r.height / s};
  }
  let toastT;
  function say(msg) {
    toast.textContent = msg; toast.hidden = false;
    toast.classList.remove('in'); void toast.offsetWidth; toast.classList.add('in');
    clearTimeout(toastT); toastT = setTimeout(() => { toast.hidden = true; }, 2400);
  }
  let menuFor = null;
  const MENUS = {
    list:[['Rename', 'Rename the conversation'], ['Tags', 'Edit tags'], ['Hand off', 'Hand off to another device']],
    id:[['Settings', 'Settings open in their own window'], ['Unpair', 'Unpair asks for confirmation first', 'danger']],
    detail:[['Copy run id', 'Copied run_7f3a2c'], ['Open transcript', 'Transcript opens in Agents'], ['Pin', 'Pinned state toggles here']],
    gh:[['Open board on GitHub', 'Opens the Work board on GitHub'], ['Group by repo', 'Groups the board by repository'], ['Show Done', 'Done stays folded in the list; unfold it there']],
    ag:[['Open runs folder', 'Opens ~/.local/state/hermes-runs on optiplex'], ['Hide finished', 'Finished runs hide until a new one starts']],
    jb:[['Show paused jobs', 'No paused jobs right now'], ['Import job', 'Import reads a Hermes cron file']],
    cm:[['Export log', 'Exports the command log as Markdown'], ['Clear search', 'Search cleared']],
    sec:[['Copy link', 'Link copied'], ['Open in a new window', 'Opens in a new window']],
  };
  function openMenu(btn) {
    closeMenu();
    menuFor = btn;
    menu.innerHTML = MENUS[btn.dataset.menu].map(([l, m, cls]) => `<button type="button" role="menuitem" class="${cls || ''}" data-act="menuitem" data-msg="${esc(m)}">${l}</button>`).join('');
    menu.hidden = false;
    const r = rel(btn), mw = 184;
    let x = ['detail', 'sec'].includes(btn.dataset.menu) ? r.x + r.w - mw : r.x;
    let y = r.y + r.h + 4;
    if (btn.dataset.menu === 'id') y = r.y - 4 - (MENUS.id.length * 30 + 10);
    menu.style.left = Math.max(8, x) + 'px'; menu.style.top = y + 'px';
    menu.classList.remove('in'); void menu.offsetWidth; menu.classList.add('in');
    btn.setAttribute('aria-expanded', 'true');
    menu.querySelector('button').focus();
  }
  function closeMenu(restore) {
    if (menu.hidden) return;
    menu.hidden = true;
    if (menuFor) { menuFor.setAttribute('aria-expanded', 'false'); if (restore && menuFor.isConnected) menuFor.focus(); }
    menuFor = null;
  }
  function showTip(el) {
    const t = el.dataset.tip; if (!t) return;
    tip.textContent = t; tip.hidden = false;
    const r = rel(el), tw = tip.offsetWidth;
    let x = r.x + r.w / 2 - tw / 2;
    x = Math.min(Math.max(8, x), win.offsetWidth - tw - 8);
    tip.style.left = x + 'px'; tip.style.top = (r.y + r.h + 6) + 'px';
  }
  const hideTip = () => { tip.hidden = true; };
  win.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
  win.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
  win.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el && el.matches(':focus-visible')) showTip(el); else hideTip(); });
  win.addEventListener('focusout', hideTip);

  /* actions */
  function send() {
    const c = conv(st.sel), input = dt.querySelector('.inrow input');
    if (!c || !input || input.disabled) return;
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    const now = new Date(), tm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    c.extra.push({who:'You', time:tm, text});
    c.preview = text; c.time = 'now';
    if (c.state !== 'run') { c.state = 'run'; c.run = 0; }
    keepFocus(() => { renderPanel(); renderList(); renderDetail(); });
    const ni = dt.querySelector('.inrow input'); if (ni) ni.focus();
  }

  win.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!menu.hidden && !e.target.closest('.menu') && !(el && el === menuFor)) closeMenu();
    if (!el) return;
    const a = el.dataset.act;
    if (a === 'section') { st.section = el.dataset.id; if (FULL) { st.filter = ''; filterInput.value = ''; } renderAll(); }
    else if (a === 'kind') {
      st.section = 'chat'; st.kind = el.dataset.id; st.filter = ''; filterInput.value = '';
      if (FULL) { const cur = conv(st.sel); if (!cur || (st.kind !== 'all' && (cur.kind || 'app') !== st.kind)) { const f = st.convs.find(c => st.kind === 'all' || (c.kind || 'app') === st.kind); if (f) st.sel = f.id; } }
      renderAll();
    }
    else if (FULL && secClick(a, el)) { /* handled by a section */ }
    else if (a === 'tg-continue') { const c = conv(st.sel); c.readOnly = false; c.sub = 'Telegram · continued in the app'; renderAll(); say('Continued in the app — replies go to Telegram too'); }
    else if (a === 'group') { st.groupOpen = !st.groupOpen; keepFocus(renderPanel); }
    else if (a === 'row') {
      const c = conv(el.dataset.id);
      if (c.state === 'done' || c.state === 'failed') c.state = null; // opening marks it seen
      st.sel = c.id; st.cmdOpen = false; renderAll();
    }
    else if (a === 'new') {
      st.newN++;
      const id = 'new' + st.newN;
      st.convs.splice(BASE.filter(c => c.pinned).length, 0, {id, title:'New conversation', time:'now', src:'app', tags:[], extra:[], preview:'No messages yet', isNew:true});
      st.section = 'chat'; st.kind = st.kind === 'all' ? 'all' : 'app'; st.sel = id; st.filter = ''; filterInput.value = '';
      renderAll();
      const ni = dt.querySelector('.inrow input'); if (ni) ni.focus();
    }
    else if (a === 'cmds') { st.cmdOpen = !st.cmdOpen; el.setAttribute('aria-expanded', st.cmdOpen); dt.querySelector('.cmdlist').hidden = !st.cmdOpen; }
    else if (a === 'term') { st.term = !st.term; el.setAttribute('aria-pressed', st.term); dt.querySelector('.term').hidden = !st.term; }
    else if (a === 'stop') { const c = conv(st.sel); c.state = null; c.extra.push({who:'Hermes', time:'now', text:'Stopped. Nothing after the last finished step was written.'}); renderAll(); say('Run stopped'); }
    else if (a === 'send') send();
    else if (a === 'approve') { const c = conv(st.sel); c.state = 'run'; c.run = 0; c.preview = 'Running ' + c.approve; renderAll(); say('Approved — run started'); }
    else if (a === 'deny') { const c = conv(st.sel); c.state = null; c.extra.push({who:'Hermes', time:'now', text:'Skipped the release build. Say when you want it.'}); c.preview = 'Skipped the release build'; renderAll(); }
    else if (a === 'menu') { if (menuFor === el) closeMenu(true); else openMenu(el); }
    else if (a === 'menuitem') { const m = el.dataset.msg; closeMenu(true); say(m); }
    else if (a === 'toast') say(el.dataset.msg);
  });
  win.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !menu.hidden) { e.preventDefault(); closeMenu(true); }
    else if (e.key === 'Enter' && e.target.matches('.inrow input')) { e.preventDefault(); send(); }
    else if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      const items = [...menu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
      items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
    }
  });
  filterInput.addEventListener('input', () => { st.filter = filterInput.value; if (FULL && st.section !== 'chat') { renderList(); return; } if (st.section !== 'chat') st.section = 'chat'; renderPanel(); renderList(); });
  win.addEventListener('change', e => { if (FULL) secChange(e.target); });
  win.addEventListener('input', e => { if (FULL && e.target.dataset.in) secInput(e.target); });

  if (open) {
    if (open === 'telegram') { st.kind = 'telegram'; st.sel = 'tg1'; }
    else if (open === 'github-check') { st.section = 'github'; st.gh.view = 'check'; }
    else st.section = open;
  }

  renderAll();
  const api = {win, st, tick() {
    st.convs.forEach(c => { if (c.state === 'run') { c.run++; win.querySelectorAll(`[data-run="${c.id}"]`).forEach(n => { n.textContent = mmss(c.run); }); } });
  }, focusFilter() { filterInput.focus(); }};
  WINS.push(api);
  return win;
}
